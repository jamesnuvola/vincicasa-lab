name: SONAR Q84 Flow-State K Sensitivity

on:
  push:
    branches:
      - research/q84-flow-state-k-sensitivity-20261109
    paths:
      - "scripts/sonar_strategy_atlas_k_sensitivity.py"
      - "scripts/validate_sonar_strategy_atlas_k_sensitivity.py"
      - "tests/test_sonar_strategy_atlas_k_sensitivity.py"
      - "reports/sequence_agent/strategy_atlas_k_sensitivity_protocol_2026-11-09.json"
      - ".github/workflows/sonar-q84-k-sensitivity.yml"

permissions:
  contents: write

concurrency:
  group: sonar-q84-flow-state-k-sensitivity
  cancel-in-progress: false

jobs:
  evaluate-validate-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/q84-flow-state-k-sensitivity-20261109
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile Q84 K sensitivity
        run: |
          python -m py_compile scripts/sonar_strategy_atlas.py scripts/sonar_strategy_atlas_k_sensitivity.py scripts/validate_sonar_strategy_atlas_k_sensitivity.py
      - name: Run Q84 K sensitivity regression tests
        run: python tests/test_sonar_strategy_atlas_k_sensitivity.py -v
      - name: Execute preregistered K=10/20/50 walk-forward
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/sonar_strategy_atlas_k_sensitivity.py
      - name: Run fail-closed acceptance validator and exact-byte checks
        run: python scripts/validate_sonar_strategy_atlas_k_sensitivity.py
      - name: Persist append-only outputs and verify Git object readback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sequence_agent/strategy_atlas_k_sensitivity_catalog.jsonl \
                  reports/sequence_agent/strategy_atlas_k_sensitivity_target_ledger.csv.gz \
                  reports/sequence_agent/strategy_atlas_k_sensitivity_report.json \
                  reports/sequence_agent/strategy_atlas_k_sensitivity_manifest.json \
                  reports/sequence_agent/strategy_atlas_k_sensitivity_checkpoint_2026-11-09.json \
                  reports/sequence_agent/strategy_atlas_k_sensitivity_validation.json
          git commit -m "Persist Q84 K sensitivity outputs [q84-k-persisted]"
          git push origin HEAD:research/q84-flow-state-k-sensitivity-20261109
          for f in \
            reports/sequence_agent/strategy_atlas_k_sensitivity_catalog.jsonl \
            reports/sequence_agent/strategy_atlas_k_sensitivity_target_ledger.csv.gz \
            reports/sequence_agent/strategy_atlas_k_sensitivity_report.json \
            reports/sequence_agent/strategy_atlas_k_sensitivity_manifest.json \
            reports/sequence_agent/strategy_atlas_k_sensitivity_checkpoint_2026-11-09.json \
            reports/sequence_agent/strategy_atlas_k_sensitivity_validation.json; do
            git show "HEAD:$f" > /tmp/q84-k-readback
            cmp "$f" /tmp/q84-k-readback
          done
