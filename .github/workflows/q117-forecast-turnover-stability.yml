name: Q117 forecast-turnover stability replay

on:
  push:
    branches: ["research/q117-forecast-turnover-stability-20261111"]
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/sonar_q117_forecast_turnover_stability.mjs"
      - "reports/sequence_agent/q117_forecast_turnover_stability_*.json"
      - "reports/sequence_agent/q117_forecast_turnover_stability_target_ledger_2026-11-11.csv"
      - ".github/workflows/q117-forecast-turnover-stability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q117-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replay Q117 and compare persisted artifacts byte-for-byte
        run: node scripts/sonar_q117_forecast_turnover_stability.mjs --check
