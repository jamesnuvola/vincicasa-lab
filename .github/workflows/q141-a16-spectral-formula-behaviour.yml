name: Q141-A16 Spectral Formula Behaviour

on:
  push:
    branches:
      - research/q141-a16-spectral-formula-behaviour-20261113
  pull_request:
    branches:
      - main
    paths:
      - "scripts/sonar_q141_a16_spectral_formula_behaviour.mjs"
      - "tests/test_sonar_q141_a16_spectral_formula_behaviour.mjs"
      - "reports/sequence_agent/q141_a16_spectral_formula_behaviour_*"
      - ".github/workflows/q141-a16-spectral-formula-behaviour.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit and leakage tests
        run: node --test tests/test_sonar_q141_a16_spectral_formula_behaviour.mjs
      - name: Generate canonical outputs on branch push
        if: github.event_name == 'push'
        run: node scripts/sonar_q141_a16_spectral_formula_behaviour.mjs
      - name: Deterministic report, ledger, eigenspectrum and manifest replay
        run: node scripts/sonar_q141_a16_spectral_formula_behaviour.mjs --verify
      - name: Persist generated outputs on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sequence_agent/q141_a16_spectral_formula_behaviour_report_2026-11-13.json
          git add reports/sequence_agent/q141_a16_spectral_formula_behaviour_report_2026-11-13.md
          git add reports/sequence_agent/q141_a16_spectral_formula_behaviour_target_ledger_2026-11-13.csv
          git add reports/sequence_agent/q141_a16_spectral_formula_behaviour_eigenvalues_2026-11-13.csv
          git add reports/sequence_agent/q141_a16_spectral_formula_behaviour_component_loadings_2026-11-13.json
          git add reports/sequence_agent/q141_a16_spectral_formula_behaviour_validation_2026-11-13.json
          git add reports/sequence_agent/q141_a16_spectral_formula_behaviour_checkpoint_2026-11-13.json
          git add reports/sequence_agent/q141_a16_spectral_formula_behaviour_manifest_2026-11-13.json
          if git diff --cached --quiet; then
            echo "Canonical A16 outputs already current."
          else
            git commit -m "Q141-A16: persist canonical spectral analysis outputs"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
