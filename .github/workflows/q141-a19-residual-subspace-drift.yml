name: SONAR Q141-A19 Residual Subspace Drift Detection
on:
  push:
    branches:
      - research/q141-a19-residual-subspace-drift-20261114
    paths:
      - "scripts/sonar_q141_a19_residual_subspace_drift.py"
      - "tests/test_sonar_q141_a19_residual_subspace_drift.py"
      - "reports/sequence_agent/q141_a19_residual_subspace_drift_protocol_2026-11-14.md"
      - ".github/workflows/q141-a19-residual-subspace-drift.yml"
permissions:
  contents: write
  actions: read
concurrency:
  group: sonar-q141-a19-residual-subspace-drift
  cancel-in-progress: true
jobs:
  residual-subspace-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      Q7_BRANCH: research/exhaustive-formula-catalog-20261025
      Q7_HEAD: 7a37cab601c5f9386131a00246963f8e4aeabf74
      SONAR_A19_BRANCH: research/q141-a19-residual-subspace-drift-20261114
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependency
        run: pip install numpy==2.2.6
      - name: Compile and run deterministic/leakage tests
        env:
          PYTHONPATH: scripts
        run: |
          python -m py_compile scripts/sonar_q141_a17_full_universe_spectral.py scripts/sonar_q141_a18_mask_lattice_residual.py scripts/sonar_q141_a19_residual_subspace_drift.py tests/test_sonar_q141_a19_residual_subspace_drift.py
          python -m unittest discover -s tests -p "test_sonar_q141_a19_residual_subspace_drift.py" -v
      - name: Fetch pinned Q7 source commit
        run: |
          git fetch origin "$Q7_BRANCH" --depth=1
          git cat-file -e "$Q7_HEAD^{commit}"
      - name: Extract pinned Q7 archive, rank parts and formula chunks
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          head = "7a37cab601c5f9386131a00246963f8e4aeabf74"
          source = Path("q7-source")
          def extract(path):
              target = source / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(subprocess.check_output(["git", "show", f"{head}:{path}"]))
          fixed = [
              "data/storico_daily.csv",
              "reports/sequence_agent/exhaustive_formula_walkforward_manifest.json",
              "reports/sequence_agent/exhaustive_formula_catalog_manifest.json",
          ]
          for path in fixed:
              extract(path)
          walk = json.loads((source / fixed[1]).read_text())
          catalog = json.loads((source / fixed[2]).read_text())
          for item in walk["parts"]:
              extract(item["path"])
          for item in catalog["storage_layout"]["formulas_stored_in_parts"]:
              extract(item["path"])
          print("A19_SOURCE_EXTRACTED", len(walk["parts"]), len(catalog["storage_layout"]["formulas_stored_in_parts"]))
          PY
      - name: Run A19 walk-forward experiment
        env:
          PYTHONPATH: scripts
        run: python scripts/sonar_q141_a19_residual_subspace_drift.py --source-dir q7-source --out-dir reports/sequence_agent
      - name: Full deterministic replay into isolated directory
        env:
          PYTHONPATH: scripts
        run: python scripts/sonar_q141_a19_residual_subspace_drift.py --source-dir q7-source --out-dir replay-output
      - name: Compare replay, validate strict-prior ledger and finalize report
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          p = Path("reports/sequence_agent")
          replay = Path("replay-output")
          prefix = "q141_a19_residual_subspace_drift_2026-11-14"
          report_path = p / f"{prefix}_report.json"
          manifest_path = p / f"{prefix}_manifest.json"
          checkpoint_path = p / f"{prefix}_checkpoint.json"
          report = json.loads(report_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          checkpoint = json.loads(checkpoint_path.read_text())
          assert report["status"] == "COMPLETED_HISTORICAL_PREQUENTIAL_RESIDUAL_DRIFT_TEST"
          assert report["source"]["q7_commit"] == "7a37cab601c5f9386131a00246963f8e4aeabf74"
          assert report["design"]["target_rows"] == 3386
          assert report["design"]["formula_count"] == 1023
          assert report["design"]["mask_residual_dimensions"] == 967
          assert report["design"]["projection_dimension"] == 64
          assert report["design"]["evaluated_targets"] == 2186
          assert report["design"]["split_counts"] == {"discovery": 1311, "validation": 437, "blind_oos": 438}
          assert report["integrity"]["future_suffix_invariance"] is True
          assert report["integrity"]["strict_prior_cutoffs"] is True
          assert report["integrity"]["drift_windows_end_before_target"] is True
          assert report["integrity"]["model_training_pairs_end_before_target"] is True
          assert report["integrity"]["current_target_capture_used_only_as_response"] is True
          assert report["integrity"]["mask_residual_orthogonality_max_error"] < 1e-9
          assert report["integrity"]["sketch_projection_orthogonality_max_error"] < 1e-10
          ledger_path = p / f"{prefix}_target_ledger.csv"
          with ledger_path.open(newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 2186
          assert all(int(r["target_index"]) >= 1201 for r in rows)
          assert all(int(r["prior_draws"]) == int(r["target_index"]) for r in rows)
          assert all(r["cutoff_date"] < r["target_date"] for r in rows)
          assert all(int(r["old_basis_end_index_exclusive"]) < int(r["target_index"]) for r in rows)
          assert all(int(r["recent_basis_end_index_exclusive"]) < int(r["target_index"]) for r in rows)
          assert all(int(r["model_train_end_index_exclusive"]) < int(r["target_index"]) for r in rows)
          compared = {}
          for name, info in manifest["outputs"].items():
              local = (p / name).read_bytes()
              replayed = (replay / name).read_bytes()
              local_sha = hashlib.sha256(local).hexdigest()
              replay_sha = hashlib.sha256(replayed).hexdigest()
              assert len(local) == info["bytes"]
              assert local_sha == info["sha256"]
              assert local_sha == replay_sha, (name, local_sha, replay_sha)
              compared[name] = {"sha256": local_sha, "bytes": len(local)}
          report["integrity"]["full_replay_byte_identity"] = True
          report["integrity"]["dedicated_ci_unit_tests"] = "PASS"
          report_path.write_text(json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n")
          md_path = p / f"{prefix}_report.md"
          md_path.write_text(md_path.read_text() + "\n\nFull deterministic replay: byte-identical (verified by the dedicated workflow).\n", encoding="utf-8")
          finalized = {}
          for path in (report_path, md_path):
              raw = path.read_bytes()
              manifest["outputs"][path.name] = {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
              finalized[path.name] = manifest["outputs"][path.name]
          validation = {
              "schema_version": "1.0",
              "experiment_id": "Q141-A19",
              "status": "FULL_REPLAY_BYTE_IDENTICAL",
              "replay_compared_outputs": compared,
              "finalized_report_hashes": finalized,
              "unit_tests": "PASS",
              "strict_prior_rows": 2186,
              "evaluated_rows": 2186,
              "formula_masks": 1023,
              "projection_dimension": 64,
              "bootstrap_replicates": 20000,
              "circular_shift_replicates_per_holdout": 999,
              "signflip_replicates": 20000
          }
          validation_path = p / f"{prefix}_validation.json"
          validation_path.write_text(json.dumps(validation, ensure_ascii=False, sort_keys=True, indent=2) + "\n")
          raw = validation_path.read_bytes()
          manifest["outputs"][validation_path.name] = {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
          manifest["status"] = "FINALIZED_WITH_FULL_REPLAY_PENDING_REMOTE_READBACK"
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, sort_keys=True, indent=2) + "\n")
          checkpoint["replay_verified"] = True
          checkpoint["validation_file"] = validation_path.name
          checkpoint["status"] = "COMPLETED_LOCAL_PENDING_REMOTE_READBACK"
          checkpoint_path.write_text(json.dumps(checkpoint, ensure_ascii=False, sort_keys=True, indent=2) + "\n")
          print("A19_REPLAY_AND_OUTPUT_VALIDATION_PASS", len(compared), len(rows))
          PY
      - name: Fail-closed local artifact validation
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("reports/sequence_agent")
          prefix = "q141_a19_residual_subspace_drift_2026-11-14"
          report = json.loads((p / f"{prefix}_report.json").read_text())
          manifest = json.loads((p / f"{prefix}_manifest.json").read_text())
          checkpoint = json.loads((p / f"{prefix}_checkpoint.json").read_text())
          validation = json.loads((p / f"{prefix}_validation.json").read_text())
          assert validation["status"] == "FULL_REPLAY_BYTE_IDENTICAL"
          assert report["integrity"]["full_replay_byte_identity"] is True
          assert checkpoint["replay_verified"] is True
          for name, info in manifest["outputs"].items():
              raw = (p / name).read_bytes()
              assert len(raw) == info["bytes"]
              assert hashlib.sha256(raw).hexdigest() == info["sha256"]
          print("A19_LOCAL_ARTIFACT_VALIDATION_PASS", len(manifest["outputs"]))
          PY
      - name: Persist generated research artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/a19-generated
          cp -a reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14_* /tmp/a19-generated/
          git fetch origin "$SONAR_A19_BRANCH:refs/remotes/origin/$SONAR_A19_BRANCH"
          git reset --hard "origin/$SONAR_A19_BRANCH"
          cp -a /tmp/a19-generated/. reports/sequence_agent/
          git add reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14_*
          if ! git diff --cached --quiet; then git commit -m "Persist Q141-A19 residual subspace drift results"; else echo "A19 artifacts already match remote; skipping no-op commit"; fi
          git push origin "HEAD:$SONAR_A19_BRANCH"
      - name: Verify remote Git readback and finalize receipt
        run: |
          git fetch origin "$SONAR_A19_BRANCH:refs/remotes/origin/$SONAR_A19_BRANCH"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          branch = "origin/research/q141-a19-residual-subspace-drift-20261114"
          p = Path("reports/sequence_agent")
          prefix = "q141_a19_residual_subspace_drift_2026-11-14"
          names = [
              f"{prefix}_report.json",
              f"{prefix}_report.md",
              f"{prefix}_target_ledger.csv",
              f"{prefix}_circular_shift_null.csv",
              f"{prefix}_source_lineage.json",
              f"{prefix}_validation.json",
              f"{prefix}_manifest.json"
          ]
          checked = {}
          for name in names:
              path = "reports/sequence_agent/" + name
              local = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              remote = subprocess.check_output(["git", "rev-parse", f"{branch}:{path}"], text=True).strip()
              assert local == remote, (path, local, remote)
              checked[path] = remote
          cp_path = p / f"{prefix}_checkpoint.json"
          cp = json.loads(cp_path.read_text())
          cp["status"] = "REMOTE_GIT_READBACK_VERIFIED"
          cp["next_action"] = "Human review of the A19 research PR; no merge or engine promotion."
          cp["remote_readback"] = {"branch": "research/q141-a19-residual-subspace-drift-20261114", "files": checked}
          cp_path.write_text(json.dumps(cp, ensure_ascii=False, sort_keys=True, indent=2) + "\n")
          receipt = {
              "schema_version": "1.0",
              "experiment_id": "Q141-A19",
              "status": "REMOTE_GIT_READBACK_VERIFIED",
              "branch": "research/q141-a19-residual-subspace-drift-20261114",
              "verified_files": checked,
              "checkpoint_git_blob_sha1": subprocess.check_output(["git", "hash-object", str(cp_path)], text=True).strip()
          }
          receipt_path = p / f"{prefix}_readback_receipt.json"
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, sort_keys=True, indent=2) + "\n")
          PY
          git add reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14_checkpoint.json reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14_readback_receipt.json
          if ! git diff --cached --quiet; then git commit -m "Finalize Q141-A19 remote Git readback"; else echo "A19 readback receipt already matches remote; skipping no-op commit"; fi
          git push origin "HEAD:$SONAR_A19_BRANCH"
          git fetch origin "$SONAR_A19_BRANCH:refs/remotes/origin/$SONAR_A19_BRANCH"
          python - <<'PY'
          import subprocess
          branch = "origin/research/q141-a19-residual-subspace-drift-20261114"
          prefix = "reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14"
          for suffix in ("_checkpoint.json", "_readback_receipt.json"):
              path = prefix + suffix
              local = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              remote = subprocess.check_output(["git", "rev-parse", f"{branch}:{path}"], text=True).strip()
              assert local == remote, (path, local, remote)
          print("A19_REMOTE_READBACK_PASS", 9)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q141-a19-residual-subspace-drift
          path: |
            reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14_report.json
            reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14_report.md
            reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14_target_ledger.csv
            reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14_circular_shift_null.csv
            reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14_source_lineage.json
            reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14_validation.json
            reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14_manifest.json
            reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14_checkpoint.json
            reports/sequence_agent/q141_a19_residual_subspace_drift_2026-11-14_readback_receipt.json
          if-no-files-found: error
          retention-days: 90
