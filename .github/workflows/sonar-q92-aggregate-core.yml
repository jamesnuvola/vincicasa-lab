name: SONAR Q92 Global Holm and Paired Inference Synthetic Acceptance
on:
  push:
    branches:
      - research/sonar-q92-aggregate-prep-20261109
      - research/sonar-q92-exact-null-calibration-20261109
      - research/sonar-q92-rank-kernel-20261109
      - research/sonar-q92-rank-kernel-ci-20261109
      - research/sonar-q92-selective-rank-20261109
    paths:
      - "scripts/sonar_q92_aggregate_common.py"
      - "scripts/aggregate_sonar_q92_ten_feature.py"
      - "scripts/validate_sonar_q92_ten_feature.py"
      - "tests/test_sonar_q92_aggregate_common.py"
      - "scripts/sonar_q92_null_calibration.py"
      - "scripts/sonar_q92_common.py"
      - "reports/sequence_agent/q92_preregistration_2026-11-09.json"
      - "reports/sequence_agent/q92_rank_kernel_02_preregistration_2026-11-09.json"
      - "tests/test_sonar_q92_null_calibration.py"
      - ".github/workflows/sonar-q92-aggregate-core.yml"
permissions:
  contents: read
concurrency:
  group: sonar-q92-aggregate-core-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile Q92 aggregate helpers and regressions
        run: python -m py_compile scripts/sonar_q92_null_calibration.py scripts/sonar_q92_common.py tests/test_sonar_q92_null_calibration.py scripts/sonar_q92_aggregate_common.py scripts/aggregate_sonar_q92_ten_feature.py scripts/validate_sonar_q92_ten_feature.py tests/test_sonar_q92_aggregate_common.py
      - name: Run Q92 Holm, selection and paired-inference synthetic regressions
        run: python tests/test_sonar_q92_aggregate_common.py -v && python tests/test_sonar_q92_null_calibration.py -v
