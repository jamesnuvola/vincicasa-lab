name: Q126 squared-gap concentration transition replay

on:
  push:
    branches: ["research/q126-gap-concentration-transition-20261111"]
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/sonar_q126_squared_gap_concentration_transition.mjs"
      - "reports/sequence_agent/q126_squared_gap_concentration_transition_*.json"
      - "reports/sequence_agent/q126_squared_gap_concentration_transition_*.csv"
      - "reports/sequence_agent/q126_squared_gap_concentration_transition_*.md"
      - ".github/workflows/q126-squared-gap-concentration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q126-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replay exact squared-gap walk-forward and verify persisted bytes
        run: node scripts/sonar_q126_squared_gap_concentration_transition.mjs --check
