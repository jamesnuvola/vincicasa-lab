name: Q126 squared-gap concentration transition replay

on:
  push:
    branches: ["research/q126-gap-concentration-transition-20261111"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q126-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'research/q126-gap-concentration-transition-20261111' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replay exact squared-gap walk-forward and verify persisted bytes
        run: node scripts/sonar_q126_squared_gap_concentration_transition.mjs --check
