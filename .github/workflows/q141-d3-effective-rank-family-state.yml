name: Q141-D3 effective-rank family-state walk-forward

on:
  push:
    branches:
      - research/q141-d3-effective-rank-family-state-20261113
    paths:
      - scripts/sonar_q141_d3_effective_rank_family_state.py
      - tests/test_sonar_q141_d3_effective_rank_family_state.py
      - reports/sequence_agent/q141_d3_effective_rank_family_state_preregistration_2026-11-13.md
      - .github/workflows/q141-d3-effective-rank-family-state.yml
  pull_request:
    branches:
      - research/q141-formula-universe-behaviour-mapping-20261112
    paths:
      - scripts/sonar_q141_d3_effective_rank_family_state.py
      - tests/test_sonar_q141_d3_effective_rank_family_state.py
      - reports/sequence_agent/q141_d3_effective_rank_family_state_preregistration_2026-11-13.md
      - .github/workflows/q141-d3-effective-rank-family-state.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: q141-d3-effective-rank-family-state
  cancel-in-progress: false

jobs:
  d3-walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.0,<4"

      - name: Download pinned Q90 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/jamesnuvola/vincicasa-lab/actions/artifacts/13627507532/zip" \
            --output /tmp/q90-source.zip

      - name: Download pinned Q141-A6 outcome artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/jamesnuvola/vincicasa-lab/actions/artifacts/13997032604/zip" \
            --output /tmp/q141-a6.zip

      - name: Run deterministic unit and leakage tests
        run: python -m unittest discover -s tests -p "test_sonar_q141_d3_effective_rank_family_state.py" -v

      - name: Execute preregistered walk-forward twice
        run: |
          set -euo pipefail
          python scripts/sonar_q141_d3_effective_rank_family_state.py \
            --q90-zip /tmp/q90-source.zip \
            --a6-zip /tmp/q141-a6.zip \
            --preregistration reports/sequence_agent/q141_d3_effective_rank_family_state_preregistration_2026-11-13.md \
            --output-dir /tmp/q141-d3-run1
          python scripts/sonar_q141_d3_effective_rank_family_state.py \
            --q90-zip /tmp/q90-source.zip \
            --a6-zip /tmp/q141-a6.zip \
            --preregistration reports/sequence_agent/q141_d3_effective_rank_family_state_preregistration_2026-11-13.md \
            --output-dir /tmp/q141-d3-run2
          for f in \
            q141_d3_effective_rank_family_state_report_2026-11-13.json \
            q141_d3_effective_rank_family_state_target_ledger_2026-11-13.csv \
            q141_d3_effective_rank_family_state_manifest_2026-11-13.json \
            q141_d3_effective_rank_family_state_checkpoint_2026-11-13.json; do
            cmp "/tmp/q141-d3-run1/$f" "/tmp/q141-d3-run2/$f"
          done

      - name: Stage deterministic D3 outputs for artifact and persistence
        run: |
          set -euo pipefail
          cp /tmp/q141-d3-run1/q141_d3_effective_rank_family_state_* reports/sequence_agent/

      - name: Persist deterministic D3 outputs
        if: github.event_name == 'push'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "sonar-q141-d3"
          git config user.email "actions@users.noreply.github.com"
          git add reports/sequence_agent/q141_d3_effective_rank_family_state_report_2026-11-13.json
          git add reports/sequence_agent/q141_d3_effective_rank_family_state_target_ledger_2026-11-13.csv
          git add reports/sequence_agent/q141_d3_effective_rank_family_state_manifest_2026-11-13.json
          git add reports/sequence_agent/q141_d3_effective_rank_family_state_checkpoint_2026-11-13.json
          if ! git diff --cached --quiet; then
            git commit -m "Q141-D3: persist effective-rank family-state walk-forward"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

      - name: Verify remote outputs, update checkpoint and create receipt
        if: github.event_name == 'push'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch origin "${BRANCH_NAME}"
          python - <<'PY'
          import hashlib, json, os, subprocess
          branch = os.environ["BRANCH_NAME"]
          prefix = "reports/sequence_agent/"
          manifest_path = prefix + "q141_d3_effective_rank_family_state_manifest_2026-11-13.json"
          checkpoint_path = prefix + "q141_d3_effective_rank_family_state_checkpoint_2026-11-13.json"
          manifest_bytes = subprocess.check_output(["git", "show", f"origin/{branch}:{manifest_path}"])
          manifest = json.loads(manifest_bytes)
          verified = []
          for entry in manifest["files"].values():
              path = prefix + entry["path"]
              data = subprocess.check_output(["git", "show", f"origin/{branch}:{path}"])
              sha256 = hashlib.sha256(data).hexdigest()
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + bytes([0]) + data).hexdigest()
              if len(data) != entry["bytes"] or sha256 != entry["sha256"] or blob != entry["git_blob_sha1"]:
                  raise SystemExit(f"exact Git readback mismatch: {path}")
              verified.append({"path": path, "bytes": len(data), "sha256": sha256, "git_blob_sha1": blob})
          cp_bytes = subprocess.check_output(["git", "show", f"origin/{branch}:{checkpoint_path}"])
          checkpoint = json.loads(cp_bytes)
          checkpoint["status"] = "REMOTE_GIT_READBACK_VERIFIED"
          checkpoint["remote_readback"] = {
              "branch": branch, "workflow_run_id": int(os.environ["RUN_ID"]),
              "verified_files": verified
          }
          with open(checkpoint_path, "w", encoding="utf-8") as f:
              json.dump(checkpoint, f, sort_keys=True, indent=2)
              f.write(chr(10))
          PY
          git add reports/sequence_agent/q141_d3_effective_rank_family_state_checkpoint_2026-11-13.json
          git commit -m "Q141-D3: attest exact remote Git readback"
          git push origin "HEAD:${BRANCH_NAME}"
          git fetch origin "${BRANCH_NAME}"
          python - <<'PY'
          import hashlib, json, os, subprocess
          branch = os.environ["BRANCH_NAME"]
          prefix = "reports/sequence_agent/"
          names = [
              "q141_d3_effective_rank_family_state_preregistration_2026-11-13.md",
              "q141_d3_effective_rank_family_state_report_2026-11-13.json",
              "q141_d3_effective_rank_family_state_target_ledger_2026-11-13.csv",
              "q141_d3_effective_rank_family_state_manifest_2026-11-13.json",
              "q141_d3_effective_rank_family_state_checkpoint_2026-11-13.json",
          ]
          files = []
          for name in names:
              path = prefix + name
              data = subprocess.check_output(["git", "show", f"origin/{branch}:{path}"])
              files.append({
                  "path": path, "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "git_blob_sha1": hashlib.sha1(f"blob {len(data)}\\0".encode() + data).hexdigest()
              })
          receipt = {
              "schema_version": "1.0", "task_id": "Q141-D3-REMOTE-READBACK",
              "status": "REMOTE_GIT_READBACK_VERIFIED", "branch": branch,
              "workflow_run_id": int(os.environ["RUN_ID"]), "files_verified": len(files),
              "files": files
          }
          receipt_path = prefix + "q141_d3_effective_rank_family_state_remote_readback_2026-11-13.json"
          with open(receipt_path, "w", encoding="utf-8") as f:
              json.dump(receipt, f, sort_keys=True, indent=2)
              f.write("\\n")
          PY
          git add reports/sequence_agent/q141_d3_effective_rank_family_state_remote_readback_2026-11-13.json
          git commit -m "Q141-D3: persist remote readback receipt"
          git push origin "HEAD:${BRANCH_NAME}"
          git fetch origin "${BRANCH_NAME}"
          python - <<'PY'
          import json, os, subprocess
          branch = os.environ["BRANCH_NAME"]
          path = "reports/sequence_agent/q141_d3_effective_rank_family_state_remote_readback_2026-11-13.json"
          receipt = json.loads(subprocess.check_output(["git", "show", f"origin/{branch}:{path}"]))
          if receipt.get("status") != "REMOTE_GIT_READBACK_VERIFIED" or receipt.get("files_verified") != 5:
              raise SystemExit("remote readback receipt verification failed")
          print("Q141-D3 exact remote Git readback verified for all five files.")
          PY

      - name: Upload deterministic replay bundle
        uses: actions/upload-artifact@v4
        with:
          name: q141-d3-effective-rank-family-state-${{ github.sha }}
          path: |
            reports/sequence_agent/q141_d3_effective_rank_family_state_report_2026-11-13.json
            reports/sequence_agent/q141_d3_effective_rank_family_state_target_ledger_2026-11-13.csv
            reports/sequence_agent/q141_d3_effective_rank_family_state_manifest_2026-11-13.json
            reports/sequence_agent/q141_d3_effective_rank_family_state_checkpoint_2026-11-13.json
            reports/sequence_agent/q141_d3_effective_rank_family_state_remote_readback_2026-11-13.json
          retention-days: 90
