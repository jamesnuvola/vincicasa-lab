name: Q141-A3 Q90 typed AST import

on:
  push:
    branches:
      - research/q141-formula-universe-behaviour-mapping-20261112
    paths-ignore:
      - "reports/sequence_agent/q90_typed_ast_catalog_*"
      - "reports/sequence_agent/q90_typed_ast_import_*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: q141-a3-q90-typed-ast-import
  cancel-in-progress: false

jobs:
  q90-ast-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Q141 research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned Q90 artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jamesnuvola/vincicasa-lab/actions/artifacts/13627507532/zip" \
            -o /tmp/q90-expanded-formula-grammar-bundle.zip
          echo "Downloaded Q90 artifact ZIP."

      - name: Run Q141-A3 AST importer unit tests
        run: python tests/test_sonar_q141_q90_ast_import.py -v

      - name: Import Q90 formulas into canonical typed AST shards
        run: |
          python scripts/sonar_q141_q90_ast_import.py \
            --zip /tmp/q90-expanded-formula-grammar-bundle.zip \
            --readback-manifest reports/sequence_agent/q141_q90_external_artifact_readback_2026-11-12.json \
            --output-dir reports/sequence_agent

      - name: Upload Q141-A3 typed AST bundle
        uses: actions/upload-artifact@v4
        with:
          name: q141-a3-q90-typed-ast-${{ github.sha }}
          path: |
            reports/sequence_agent/q90_typed_ast_catalog_part_*.jsonl.gz
            reports/sequence_agent/q90_typed_ast_import_report_2026-11-12.json
            reports/sequence_agent/q90_typed_ast_import_manifest_2026-11-12.json
            reports/sequence_agent/q90_typed_ast_import_checkpoint_2026-11-12.json
          retention-days: 90

      - name: Persist Q141-A3 outputs append-only
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git add reports/sequence_agent/q90_typed_ast_catalog_part_*.jsonl.gz
          git add reports/sequence_agent/q90_typed_ast_import_report_2026-11-12.json
          git add reports/sequence_agent/q90_typed_ast_import_manifest_2026-11-12.json
          git add reports/sequence_agent/q90_typed_ast_import_checkpoint_2026-11-12.json
          if git diff --cached --quiet; then
            echo "Q141-A3 outputs already match this checkout."
          else
            git config user.name "sonar-q141-research"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Persist Q141-A3 Q90 typed AST catalog"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin "${BRANCH_NAME}"
              if git rebase "origin/${BRANCH_NAME}" && git push origin "HEAD:${BRANCH_NAME}"; then
                pushed=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                git rebase --abort || true
                echo "Remote branch advanced; retrying append-only persistence."
              fi
            done
            if [ "$pushed" != "true" ]; then
              echo "Q141-A3 persistence failed after three attempts."
              exit 1
            fi
          fi

      - name: Verify exact remote Git readback
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin "${BRANCH_NAME}"
          python - <<'PY'
          import hashlib, json, subprocess, os
          branch = os.environ["BRANCH_NAME"]
          manifest_path = "reports/sequence_agent/q90_typed_ast_import_manifest_2026-11-12.json"
          report_path = "reports/sequence_agent/q90_typed_ast_import_report_2026-11-12.json"
          checkpoint_path = "reports/sequence_agent/q90_typed_ast_import_checkpoint_2026-11-12.json"
          manifest = json.loads(subprocess.check_output(["git", "show", f"origin/{branch}:{manifest_path}"]))
          for name, expected in manifest["files"].items():
              path = "reports/sequence_agent/" + name
              remote = subprocess.check_output(["git", "show", f"origin/{branch}:{path}"])
              if hashlib.sha256(remote).hexdigest() != expected["sha256"]:
                  raise SystemExit(f"remote SHA-256 mismatch: {path}")
              if len(remote) != expected["bytes"]:
                  raise SystemExit(f"remote byte-length mismatch: {path}")
              blob = subprocess.check_output(["git", "rev-parse", f"origin/{branch}:{path}"], text=True).strip()
              if blob != expected["git_blob_sha1"]:
                  raise SystemExit(f"remote Git blob SHA-1 mismatch: {path}")
          json.loads(subprocess.check_output(["git", "show", f"origin/{branch}:{report_path}"]))
          json.loads(subprocess.check_output(["git", "show", f"origin/{branch}:{checkpoint_path}"]))
          print(f"Q141-A3 exact remote readback verified for {len(manifest['files'])} files.")
          PY
