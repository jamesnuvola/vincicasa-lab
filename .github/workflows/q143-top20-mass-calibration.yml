name: Q143 Top20 Score-Mass Calibration
on:
  push:
    branches: ["research/q143-top20-mass-calibration-20261113"]
  pull_request:
    paths:
      - "scripts/sonar_q143_top20_mass_calibration.mjs"
      - "tests/test_sonar_q143_top20_mass_calibration.mjs"
      - "reports/sequence_agent/q143_top20_mass_calibration_*"
      - ".github/workflows/q143-top20-mass-calibration.yml"
permissions:
  contents: write
concurrency:
  group: q143-\${{ github.ref }}
  cancel-in-progress: false
jobs:
  q143:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recompute deterministic report and ledger
        run: node scripts/sonar_q143_top20_mass_calibration.mjs --write
      - name: Persist recomputed artifacts if changed
        run: |
          git config user.name "sonar-q143-agent"
          git config user.email "actions@users.noreply.github.com"
          git add reports/sequence_agent/q143_top20_mass_calibration_report_2026-11-13.json reports/sequence_agent/q143_top20_mass_calibration_ledger_2026-11-13.csv
          if ! git diff --cached --quiet; then
            git commit -m "Q143: persist deterministic score-mass replay"
            git push origin HEAD:research/q143-top20-score-mass-calibration-20261113
          fi
      - name: Verify deterministic report and ledger replay
        run: node scripts/sonar_q143_top20_mass_calibration.mjs --check
      - name: Unit and leakage tests
        run: node --test tests/test_sonar_q143_top20_mass_calibration.mjs
