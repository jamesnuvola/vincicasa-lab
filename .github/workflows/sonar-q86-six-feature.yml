name: SONAR Q86 Six-Feature Formula Grammar
on:
  push:
    branches: ["research/per-number-condition-grammar-20261026"]
    paths:
      - ".github/workflows/sonar-q86-six-feature.yml"
      - "scripts/sonar_per_number_condition_6plus_grammar.py"
      - "scripts/chunk_q86_outputs.py"
      - "scripts/persist_q86_outputs.py"
      - "scripts/sonar_research_queue.py"
      - "scripts/validate_formula_outputs.py"
      - "tests/test_sonar_per_number_condition_6plus_grammar.py"
      - "reports/sequence_agent/research_backlog.json"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: sonar-q86-six-feature
  cancel-in-progress: false
jobs:
  evaluate-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/per-number-condition-grammar-20261026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Check Q86 syntax and acceptance tests
        run: |
          python -m py_compile scripts/sonar_per_number_condition_6plus_grammar.py scripts/chunk_q86_outputs.py scripts/persist_q86_outputs.py
          python tests/test_sonar_per_number_condition_6plus_grammar.py -v
      - name: Evaluate all 296,010 six-feature formulas in bounded batches
        run: python scripts/sonar_per_number_condition_6plus_grammar.py
      - name: Chunk metrics for safe Git Data API persistence
        run: python scripts/chunk_q86_outputs.py
      - name: Validate queue, archive cutoffs, target ledger, formula coverage and Holm family
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_UPDATE_CHECKPOINT: "1"
        run: |
          python scripts/sonar_research_queue.py
          python scripts/validate_formula_outputs.py
      - name: Persist Q86 outputs via Git Data API and reread exact bytes
        id: persist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/persist_q86_outputs.py
      - name: Request exact-head CI after persistence
        if: ${{ steps.persist.outputs.commit_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error -X POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"research/per-number-condition-grammar-20261026\"}"
