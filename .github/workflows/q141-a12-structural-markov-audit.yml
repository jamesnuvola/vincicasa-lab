name: SONAR Q141-A12 Structural Markov Audit
on:
  push:
    branches:
      - research/q141-a12-structural-markov-20261113
    paths:
      - .github/workflows/q141-a12-structural-markov-audit.yml
      - scripts/sonar_q141_a12_structural_markov_audit.py
      - tests/test_sonar_q141_a12_structural_markov_audit.py
permissions:
  actions: read
  contents: write
concurrency:
  group: q141-a12-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/q141-a12-structural-markov-20261113
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Retrieve pinned Q141-A7 source artifact
        uses: actions/download-artifact@v4
        with:
          name: q141-a7-fresh59-behaviour
          run-id: 43348144964
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source
      - name: Run prior-only walk-forward and tests
        run: |
          set -euo pipefail
          MATRIX="$(find source -name 'q141_a7_fresh59_feature_matrix_2026-11-13.npz' -print -quit)"
          test -n "$MATRIX"
          python scripts/sonar_q141_a12_structural_markov_audit.py --input "$MATRIX" --outdir reports/sequence_agent
          python -m unittest discover -s tests -p 'test_sonar_q141_a12_structural_markov_audit.py' -v
      - name: Persist generated report and ledger
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sequence_agent/q141_a12_structural_markov_report_2026-11-13.json reports/sequence_agent/q141_a12_structural_markov_target_ledger_2026-11-13.csv reports/sequence_agent/q141_a12_structural_markov_preregistration_2026-11-13.md reports/sequence_agent/q141_a12_structural_markov_manifest_2026-11-13.json reports/sequence_agent/q141_a12_structural_markov_checkpoint_2026-11-13.json reports/sequence_agent/q141_cycle_report_2026-11-13_run22.md
          if ! git diff --cached --quiet; then
            git commit -m 'Persist Q141-A12 structural Markov audit outputs'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: q141-a12-structural-markov-output
          path: |
            reports/sequence_agent/q141_a12_structural_markov_report_2026-11-13.json
            reports/sequence_agent/q141_a12_structural_markov_target_ledger_2026-11-13.csv
            reports/sequence_agent/q141_a12_structural_markov_manifest_2026-11-13.json
            reports/sequence_agent/q141_a12_structural_markov_checkpoint_2026-11-13.json
