name: SONAR Q92 Ten-Feature Catalog Unit Tests

on:
  push:
    branches:
      - research/sonar-q92-ten-feature-prereg-20261109
    paths:
      - ".github/workflows/sonar-q92-ten-feature.yml"
      - "scripts/sonar_q92_common.py"
      - "scripts/sonar_per_number_condition_grammar.py"
      - "scripts/sonar_per_number_condition_4plus_grammar.py"
      - "scripts/sonar_per_number_condition_10plus_shard.py"
      - "scripts/aggregate_sonar_q92_shards.py"
      - "scripts/sonar_q92_acceptance.py"
      - "scripts/persist_sonar_q92_outputs.py"
      - "tests/test_sonar_q92_formula_universe.py"
      - "tests/test_sonar_q92_aggregate.py"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
    paths:
      - ".github/workflows/sonar-q92-ten-feature.yml"
      - "scripts/sonar_q92_common.py"
      - "scripts/sonar_per_number_condition_10plus_shard.py"
      - "scripts/aggregate_sonar_q92_shards.py"
      - "scripts/sonar_q92_acceptance.py"
      - "scripts/persist_sonar_q92_outputs.py"
      - "tests/test_sonar_q92_formula_universe.py"
      - "tests/test_sonar_q92_aggregate.py"
      - "reports/sequence_agent/q92_preregistration_2026-11-09.json"
      - "reports/sequence_agent/q92_preregistration_2026-11-09.md"

permissions:
  contents: read

concurrency:
  group: sonar-q92-unit-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile Q92 combinadic module, shard evaluator, aggregator, acceptance, persister and tests
        run: python -m py_compile scripts/sonar_q92_common.py scripts/sonar_per_number_condition_grammar.py scripts/sonar_per_number_condition_4plus_grammar.py scripts/sonar_per_number_condition_10plus_shard.py scripts/aggregate_sonar_q92_shards.py scripts/sonar_q92_acceptance.py scripts/persist_sonar_q92_outputs.py tests/test_sonar_q92_formula_universe.py tests/test_sonar_q92_aggregate.py
      - name: Test exact formula universe, shard coverage, rank/unrank and invalid-input guards
        run: python tests/test_sonar_q92_formula_universe.py -v
      - name: Test Q92 aggregation, selection, Holm and paired inference primitives
        run: python tests/test_sonar_q92_aggregate.py -v
