name: SONAR Q92 Ten-Feature Walk-Forward Shard Synthetic Acceptance
on:
  push:
    branches:
      - research/sonar-q92-ten-feature-implementation-20261109
      - research/sonar-q92-exact-null-calibration-20261109
      - research/sonar-q92-rank-kernel-20261109
      - research/sonar-q92-rank-kernel-ci-20261109
      - research/sonar-q92-selective-rank-20261109
      - research/sonar-q92-selective-rank-batch-sweep-20261109
    paths:
      - "scripts/sonar_q92_common.py"
      - "scripts/sonar_per_number_condition_10plus_shard.py"
      - "tests/test_sonar_q92_walkforward_shard.py"
      - "tests/benchmark_sonar_q92_rank_kernel.py"
      - ".github/workflows/sonar-q92-ten-feature.yml"
      - "scripts/sonar_q92_null_calibration.py"
      - "tests/test_sonar_q92_null_calibration.py"
      - "reports/sequence_agent/q92_preregistration_2026-11-09.json"
      - "reports/sequence_agent/q92_rank_kernel_02_preregistration_2026-11-09.json"
      - "reports/sequence_agent/q92_rank_kernel_03_batch_sweep_preregistration_2026-11-09.json"
      - "scripts/sonar_q92_aggregate_common.py"
      - "tests/test_sonar_q92_aggregate_common.py"
permissions:
  contents: read
concurrency:
  group: sonar-q92-ten-feature-synthetic-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile Q92 combinadic and walk-forward runner
        run: python -m py_compile scripts/sonar_q92_null_calibration.py scripts/sonar_q92_common.py scripts/sonar_per_number_condition_10plus_shard.py tests/test_sonar_q92_null_calibration.py tests/test_sonar_q92_walkforward_shard.py
      - name: Run Q92 catalog and strict-prefix synthetic regressions
        run: python tests/test_sonar_q92_walkforward_shard.py -v && python tests/test_sonar_q92_null_calibration.py -v && python tests/benchmark_sonar_q92_rank_kernel.py
