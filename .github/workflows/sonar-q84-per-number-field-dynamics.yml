name: SONAR Q84 Per-Number Field Dynamics

on:
  pull_request:
    branches:
      - research/q84-flow-state-k-sensitivity-20261109
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: sonar-q84-per-number-field-dynamics
  cancel-in-progress: false

jobs:
  evaluate-validate-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Detect persisted-output replay
        id: state
        run: |
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" == *"[q84-field-persisted]"* ]]; then
            echo "persisted=true" >> "$GITHUB_OUTPUT"
          else
            echo "persisted=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile field model and acceptance validator
        run: |
          python -m py_compile scripts/sonar_strategy_atlas.py scripts/sonar_strategy_atlas_k_sensitivity.py scripts/sonar_per_number_field_dynamics.py scripts/validate_sonar_per_number_field_dynamics.py
      - name: Run field, graph, null-calibration and prefix-invariance regressions
        run: python tests/test_sonar_per_number_field_dynamics.py -v
      - name: Execute registered 40-node field walk-forward
        if: steps.state.outputs.persisted != 'true'
        env:
          GITHUB_SHA: \${{ github.event.pull_request.head.sha }}
        run: python scripts/sonar_per_number_field_dynamics.py
      - name: Replay all target cutoffs, rank vectors, exact nulls and Holm family
        if: steps.state.outputs.persisted != 'true'
        run: python scripts/validate_sonar_per_number_field_dynamics.py
      - name: Persist append-only field artifacts and verify exact Git readback
        if: steps.state.outputs.persisted != 'true'
        env:
          TARGET_BRANCH: \${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sequence_agent/q84_per_number_field_catalog.jsonl \
                  reports/sequence_agent/q84_per_number_field_target_ledger.csv.gz \
                  reports/sequence_agent/q84_per_number_field_report.json \
                  reports/sequence_agent/q84_per_number_field_manifest.json \
                  reports/sequence_agent/q84_per_number_field_checkpoint_2026-11-09.json \
                  reports/sequence_agent/q84_per_number_field_validation.json
          git commit -m "Persist Q84 per-number field dynamics [q84-field-persisted]"
          git push origin "HEAD:$TARGET_BRANCH"
          for f in \
            reports/sequence_agent/q84_per_number_field_catalog.jsonl \
            reports/sequence_agent/q84_per_number_field_target_ledger.csv.gz \
            reports/sequence_agent/q84_per_number_field_report.json \
            reports/sequence_agent/q84_per_number_field_manifest.json \
            reports/sequence_agent/q84_per_number_field_checkpoint_2026-11-09.json \
            reports/sequence_agent/q84_per_number_field_validation.json; do
            git show "HEAD:$f" > /tmp/q84-field-readback
            cmp "$f" /tmp/q84-field-readback
          done
      - name: Revalidate persisted exact-head outputs without modifying them
        if: steps.state.outputs.persisted == 'true'
        run: python scripts/validate_sonar_per_number_field_dynamics.py --read-only
