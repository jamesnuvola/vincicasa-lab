name: Q141-A26 Typed-AST Semantic Mapping
on:
  push:
    branches: [research/q141-a26-typed-ast-semantic-mapping-20261114]
    paths:
      - "scripts/sonar_q141_a26_typed_ast_semantic_mapping.py"
      - "tests/test_sonar_q141_a26_typed_ast_semantic_mapping.py"
      - "reports/sequence_agent/q141_a26_typed_ast_semantic_mapping_preregistration_2026-11-14.*"
      - ".github/workflows/q141-a26-typed-ast-semantic-mapping.yml"
  pull_request:
    branches: [research/q141-a25-mask-cardinality-dynamics-20261114]
    paths:
      - "scripts/sonar_q141_a26_typed_ast_semantic_mapping.py"
      - "tests/test_sonar_q141_a26_typed_ast_semantic_mapping.py"
      - "reports/sequence_agent/q141_a26_typed_ast_semantic_mapping_preregistration_2026-11-14.*"
      - ".github/workflows/q141-a26-typed-ast-semantic-mapping.yml"
permissions:
  contents: write
concurrency:
  group: q141-a26-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  semantic-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=1.26,<3"
      - name: Fetch pinned AST source commit
        env:
          SOURCE_BRANCH: research/q141-formula-universe-behaviour-mapping-20261112
          SOURCE_SHA: 6bc727a46c65fecceff3410a7a635e42c62b4af5
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_BRANCH"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git worktree add --detach "$RUNNER_TEMP/q141-a26-source" "$SOURCE_SHA"
      - name: Run focused tests
        run: python -m unittest discover -s tests -p "test_sonar_q141_a26_typed_ast_semantic_mapping.py" -v
      - name: Execute A26 audit and walk-forward
        run: python scripts/sonar_q141_a26_typed_ast_semantic_mapping.py --source-root "$RUNNER_TEMP/q141-a26-source" --output-dir reports/sequence_agent
      - name: Deterministic replay
        run: |
          set -euo pipefail
          replay_dir="$(mktemp -d)"
          python scripts/sonar_q141_a26_typed_ast_semantic_mapping.py --source-root "$RUNNER_TEMP/q141-a26-source" --output-dir "$replay_dir"
          for file in q141_a26_typed_ast_semantic_mapping_report_2026-11-14.json q141_a26_typed_ast_semantic_mapping_report_2026-11-14.md q141_a26_semantic_crosswalk_2026-11-14.csv q141_a26_operator_ablation_target_ledger_2026-11-14.csv q141_a26_semantic_signature_summary_2026-11-14.json q141_a26_validation_2026-11-14.json q141_a26_manifest_2026-11-14.json q141_a26_checkpoint_2026-11-14.json; do cmp "reports/sequence_agent/$file" "$replay_dir/$file"; done
          rm -rf "$replay_dir"
          python scripts/sonar_q141_a26_typed_ast_semantic_mapping.py --output-dir reports/sequence_agent --finalize-replay
      - name: Persist outputs
        env:
          BRANCH_NAME: research/q141-a26-typed-ast-semantic-mapping-20261114
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          files=(reports/sequence_agent/q141_a26_typed_ast_semantic_mapping_report_2026-11-14.json reports/sequence_agent/q141_a26_typed_ast_semantic_mapping_report_2026-11-14.md reports/sequence_agent/q141_a26_semantic_crosswalk_2026-11-14.csv reports/sequence_agent/q141_a26_operator_ablation_target_ledger_2026-11-14.csv reports/sequence_agent/q141_a26_semantic_signature_summary_2026-11-14.json reports/sequence_agent/q141_a26_validation_2026-11-14.json reports/sequence_agent/q141_a26_manifest_2026-11-14.json reports/sequence_agent/q141_a26_checkpoint_2026-11-14.json)
          for file in "${files[@]}"; do mkdir -p "$temp_dir/$(dirname "$file")"; cp "$file" "$temp_dir/$file"; done
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH_NAME"; git reset --hard "origin/$BRANCH_NAME"
            for file in "${files[@]}"; do cp "$temp_dir/$file" "$file"; done
            git add "${files[@]}"
            if git diff --cached --quiet; then pushed=true; break; fi
            git config user.name "sonar-q141-research"; git config user.email "actions@users.noreply.github.com"
            git commit -m "Persist Q141-A26 typed-AST semantic mapping results"
            if git push origin "HEAD:$BRANCH_NAME"; then pushed=true; break; fi
          done
          rm -rf "$temp_dir"
          if [ "$pushed" != "true" ]; then exit 1; fi
      - name: Verify remote readback and persist receipt
        env:
          BRANCH_NAME: research/q141-a26-typed-ast-semantic-mapping-20261114
          SOURCE_SHA: 6bc727a46c65fecceff3410a7a635e42c62b4af5
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH_NAME"
          python - <<'PY'
          import hashlib,json,os,subprocess
          branch=os.environ["BRANCH_NAME"];source=os.environ["SOURCE_SHA"];prefix="reports/sequence_agent/"
          def show(ref,path):return subprocess.check_output(["git","show",f"{ref}:{path}"])
          def blob(b):return hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          mp=prefix+"q141_a26_manifest_2026-11-14.json";cp=prefix+"q141_a26_checkpoint_2026-11-14.json"
          mb=show("origin/"+branch,mp);m=json.loads(mb);outs=[];code=[];src=[]
          for item in m["files"]:
            b=show("origin/"+branch,item["path"])
            if len(b)!=item["bytes"] or hashlib.sha256(b).hexdigest()!=item["sha256"] or blob(b)!=item["git_blob_sha1"]:raise SystemExit("output mismatch "+item["path"])
            outs.append({"path":item["path"],"sha256":hashlib.sha256(b).hexdigest(),"git_blob_sha1":blob(b)})
          for item in m["code_lineage"]:
            b=show("origin/"+branch,item["path"])
            if len(b)!=item["bytes"] or hashlib.sha256(b).hexdigest()!=item["sha256"] or blob(b)!=item["git_blob_sha1"]:raise SystemExit("code mismatch "+item["path"])
            code.append({"path":item["path"],"sha256":hashlib.sha256(b).hexdigest(),"git_blob_sha1":blob(b)})
          for item in m["source"]["files"]:
            b=show(source,item["path"])
            if len(b)!=item["bytes"] or hashlib.sha256(b).hexdigest()!=item["sha256"] or blob(b)!=item["git_blob_sha1"]:raise SystemExit("source mismatch "+item["path"])
            src.append({"path":item["path"],"sha256":hashlib.sha256(b).hexdigest(),"git_blob_sha1":blob(b)})
          cb=show("origin/"+branch,cp);c=json.loads(cb)
          receipt={"schema_version":"1.0","task_id":"Q141-A26_REMOTE_READBACK","status":"REMOTE_GIT_READBACK_VERIFIED","branch":branch,"source_commit":source,
            "manifest_sha256":hashlib.sha256(mb).hexdigest(),"manifest_git_blob_sha1":blob(mb),"outputs_verified":len(outs),"outputs":outs,
            "code_lineage_verified":len(code),"code_lineage":code,"pinned_source_files_verified":len(src),"pinned_source_files":src,
            "checkpoint_before_receipt":{"status":c.get("status"),"git_blob_sha1":blob(cb)}}
          rp=prefix+"q141_a26_readback_receipt_2026-11-14.json"
          with open(rp,"w") as f:json.dump(receipt,f,sort_keys=True,indent=2);f.write("\n")
          c["status"]="REMOTE_GIT_READBACK_VERIFIED";c["readback_receipt_path"]=rp;c["remote_outputs_verified"]=len(outs);c["remote_code_lineage_verified"]=len(code);c["pinned_source_files_verified"]=len(src)
          with open(cp,"w") as f:json.dump(c,f,sort_keys=True,indent=2);f.write("\n")
          PY
          git add reports/sequence_agent/q141_a26_readback_receipt_2026-11-14.json reports/sequence_agent/q141_a26_checkpoint_2026-11-14.json
          if ! git diff --cached --quiet; then
            git config user.name "sonar-q141-research";git config user.email "actions@users.noreply.github.com";git commit -m "Verify Q141-A26 remote Git readback"
            pushed=false
            for attempt in 1 2 3; do git fetch origin "$BRANCH_NAME"; if git rebase "origin/$BRANCH_NAME" && git push origin "HEAD:$BRANCH_NAME"; then pushed=true;break;fi;git rebase --abort||true;done
            if [ "$pushed" != "true" ];then exit 1;fi
          fi
      - name: Final readback check
        env:
          BRANCH_NAME: research/q141-a26-typed-ast-semantic-mapping-20261114
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH_NAME"
          python - <<'PY'
          import json,os,subprocess
          b=os.environ["BRANCH_NAME"];p="reports/sequence_agent/"
          def show(path):return subprocess.check_output(["git","show",f"origin/{b}:{path}"])
          r=json.loads(show(p+"q141_a26_readback_receipt_2026-11-14.json"));c=json.loads(show(p+"q141_a26_checkpoint_2026-11-14.json"))
          if r.get("status")!="REMOTE_GIT_READBACK_VERIFIED" or r.get("outputs_verified")!=6 or r.get("code_lineage_verified")!=5 or r.get("pinned_source_files_verified")<20:raise SystemExit("A26 receipt invalid")
          if c.get("status")!="REMOTE_GIT_READBACK_VERIFIED":raise SystemExit("A26 checkpoint invalid")
          print("A26_REMOTE_READBACK_OK outputs=6 code=5 sources="+str(r["pinned_source_files_verified"]))
          PY
