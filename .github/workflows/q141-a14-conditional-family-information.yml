name: Q141-A14 conditional family information

on:
  push:
    branches:
      - research/q141-a14-conditional-family-information-20261113
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: q141-a14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: pip install numpy
      - name: Retrieve pinned Q141-A7 59-feature artifact
        uses: actions/download-artifact@v4
        with:
          name: q141-a7-fresh59-behaviour
          run-id: 43348144964
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source
      - name: Compile and run Q141-A14 unit tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/sonar_q141_a14_conditional_family_information.py
          python -m unittest discover -s tests -p 'test_sonar_q141_a14_conditional_family_information.py' -v
      - name: Run strict-prior 59-feature conditional-family walk-forward
        run: |
          set -euo pipefail
          MATRIX="$(find source -name 'q141_a7_fresh59_feature_matrix_2026-11-13.npz' -print -quit)"
          test -n "$MATRIX"
          python scripts/sonar_q141_a14_conditional_family_information.py --matrix "$MATRIX" --outdir reports/sequence_agent
      - name: Verify deterministic full replay
        run: |
          set -euo pipefail
          MATRIX="$(find source -name 'q141_a7_fresh59_feature_matrix_2026-11-13.npz' -print -quit)"
          mkdir -p /tmp/q141-a14-replay
          python scripts/sonar_q141_a14_conditional_family_information.py --matrix "$MATRIX" --outdir /tmp/q141-a14-replay
          diff -ru reports/sequence_agent /tmp/q141-a14-replay
      - name: Persist generated Q141-A14 evidence on research branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sequence_agent/q141_a14_conditional_family_information_*
          if ! git diff --cached --quiet; then
            git commit -m 'Persist Q141-A14 conditional family information audit'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Require committed replay parity on pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --exit-code -- reports/sequence_agent/q141_a14_conditional_family_information_*
          test -z "$(git ls-files --others --exclude-standard reports/sequence_agent/q141_a14_conditional_family_information_*)"
      - name: Upload Q141-A14 reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: q141-a14-conditional-family-information-output
          path: |
            reports/sequence_agent/q141_a14_conditional_family_information_report_2026-11-13.json
            reports/sequence_agent/q141_a14_conditional_family_information_report_2026-11-13.md
            reports/sequence_agent/q141_a14_conditional_family_information_target_ledger_2026-11-13.csv
            reports/sequence_agent/q141_a14_conditional_family_information_methodology_note_2026-11-13.md
            reports/sequence_agent/q141_a14_conditional_family_information_manifest_2026-11-13.json
            reports/sequence_agent/q141_a14_conditional_family_information_checkpoint_2026-11-13.json
