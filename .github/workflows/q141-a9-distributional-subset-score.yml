name: SONAR Q141-A9 Distributional Subset Score
on:
  push:
    branches:
      - research/q141-a7-fresh59-behaviour-20261113
    paths:
      - "scripts/sonar_q141_a9_distributional_subset_score.py"
      - "tests/test_sonar_q141_a9_distributional_subset_score.py"
      - "reports/sequence_agent/q141_a9_distributional_subset_score_preregistration_2026-11-13.md"
      - ".github/workflows/q141-a9-distributional-subset-score.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "scripts/sonar_q141_a9_distributional_subset_score.py"
      - "tests/test_sonar_q141_a9_distributional_subset_score.py"
      - "reports/sequence_agent/q141_a9_distributional_subset_score_preregistration_2026-11-13.md"
      - ".github/workflows/q141-a9-distributional-subset-score.yml"
permissions:
  contents: write
  actions: read
concurrency:
  group: sonar-q141-a7-fresh59-behaviour
  cancel-in-progress: false
jobs:
  distributional-walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/q141-a7-fresh59-behaviour-20261113
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: pip install numpy
      - name: Compile and run unit/leakage tests
        env:
          PYTHONPATH: scripts
        run: |
          python -m py_compile scripts/sonar_q141_a7_fresh59_behaviour.py scripts/sonar_q141_a9_distributional_subset_score.py tests/test_sonar_q141_a9_distributional_subset_score.py
          python -m unittest discover -s tests -p "test_sonar_q141_a9_distributional_subset_score.py" -v
      - name: Run strict-prior distributional walk-forward
        env:
          PYTHONPATH: scripts
        run: python scripts/sonar_q141_a9_distributional_subset_score.py
      - name: Fail-closed output validation
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          p=Path("reports/sequence_agent")
          report=json.loads((p/"q141_a9_distributional_subset_score_report_2026-11-13.json").read_text())
          manifest=json.loads((p/"q141_a9_distributional_subset_score_manifest_2026-11-13.json").read_text())
          checkpoint=json.loads((p/"q141_a9_distributional_subset_score_checkpoint_2026-11-13.json").read_text())
          assert report["status"]=="COMPLETED_HISTORICAL_EXPLORATORY_WALK_FORWARD"
          assert report["source"]["archive_blob_sha1"]=="6e53bd2dc02932d1cef5af4f68e17734d9d1e6cb"
          assert report["design"]["split_counts"]=={"discovery":2014,"validation":671,"blind_oos":671}
          assert report["integrity"]["all_cutoffs_precede_targets"] is True
          assert report["design"]["temperature_fit_split"]=="Discovery only; frozen before Validation and Blind OOS"
          with (p/"q141_a9_distributional_subset_score_target_ledger_2026-11-13.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==3356
          assert all(r["cutoff_date"] < r["target_date"] for r in rows)
          assert all(int(r["prior_draws"])==int(r["target_index"])+50 for r in rows)
          for name,info in manifest["outputs"].items():
              path=p/name
              assert path.stat().st_size==info["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest()==info["sha256"]
          assert checkpoint["status"]=="COMPLETED_LOCAL_PENDING_REMOTE_READBACK"
          print("A9_OUTPUT_VALIDATION_PASS",len(rows),len(manifest["outputs"]))
          PY
      - name: Persist report, ledger, manifest and checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sequence_agent/q141_a9_distributional_subset_score_report_2026-11-13.json \
                  reports/sequence_agent/q141_a9_distributional_subset_score_target_ledger_2026-11-13.csv \
                  reports/sequence_agent/q141_a9_distributional_subset_score_manifest_2026-11-13.json \
                  reports/sequence_agent/q141_a9_distributional_subset_score_checkpoint_2026-11-13.json \
                  reports/sequence_agent/q141_cycle_report_2026-11-13_run19.json
          git commit -m "Persist Q141-A9 distributional subset walk-forward"
          git fetch origin research/q141-a7-fresh59-behaviour-20261113
          git rebase origin/research/q141-a7-fresh59-behaviour-20261113
          git push origin HEAD:research/q141-a7-fresh59-behaviour-20261113
      - name: Verify remote readback and finalize checkpoint
        run: |
          git fetch origin research/q141-a7-fresh59-behaviour-20261113
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          branch="origin/research/q141-a7-fresh59-behaviour-20261113"
          paths=[
            "reports/sequence_agent/q141_a9_distributional_subset_score_report_2026-11-13.json",
            "reports/sequence_agent/q141_a9_distributional_subset_score_target_ledger_2026-11-13.csv",
            "reports/sequence_agent/q141_a9_distributional_subset_score_manifest_2026-11-13.json",
            "reports/sequence_agent/q141_cycle_report_2026-11-13_run19.json"
          ]
          checked={}
          for path in paths:
              local=subprocess.check_output(["git","hash-object",path],text=True).strip()
              remote=subprocess.check_output(["git","rev-parse",f"{branch}:{path}"],text=True).strip()
              assert local==remote,(path,local,remote)
              checked[path]=remote
          cp_path=Path("reports/sequence_agent/q141_a9_distributional_subset_score_checkpoint_2026-11-13.json")
          cp=json.loads(cp_path.read_text())
          cp["status"]="REMOTE_GIT_READBACK_VERIFIED"
          cp["remote_readback"]={"branch":"research/q141-a7-fresh59-behaviour-20261113","files":checked}
          cp_path.write_text(json.dumps(cp,ensure_ascii=False,indent=2)+"\n")
          PY
          git add reports/sequence_agent/q141_a9_distributional_subset_score_checkpoint_2026-11-13.json
          git commit -m "Record Q141-A9 remote readback verification"
          git push origin HEAD:research/q141-a7-fresh59-behaviour-20261113
          git fetch origin research/q141-a7-fresh59-behaviour-20261113
          test "$(git hash-object reports/sequence_agent/q141_a9_distributional_subset_score_checkpoint_2026-11-13.json)" = "$(git rev-parse origin/research/q141-a7-fresh59-behaviour-20261113:reports/sequence_agent/q141_a9_distributional_subset_score_checkpoint_2026-11-13.json)"
      - uses: actions/upload-artifact@v4
        with:
          name: q141-a9-distributional-subset-score
          path: |
            reports/sequence_agent/q141_a9_distributional_subset_score_report_2026-11-13.json
            reports/sequence_agent/q141_a9_distributional_subset_score_target_ledger_2026-11-13.csv
            reports/sequence_agent/q141_a9_distributional_subset_score_manifest_2026-11-13.json
            reports/sequence_agent/q141_a9_distributional_subset_score_checkpoint_2026-11-13.json
            reports/sequence_agent/q141_cycle_report_2026-11-13_run19.json
          if-no-files-found: error
          retention-days: 90
