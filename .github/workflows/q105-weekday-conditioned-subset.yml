name: Q105 weekday-conditioned subset walk-forward

on:
  push:
    branches:
      - research/q105-weekday-conditioned-subset-20261110
    paths:
      - "data/storico_daily.csv"
      - "reports/sequence_agent/q105_weekday_conditioned_subset_protocol_2026-11-10.json"
      - "scripts/sonar_q105_weekday_conditioned_subset.js"
      - ".github/workflows/q105-weekday-conditioned-subset.yml"

concurrency:
  group: q105-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  q105-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check runner syntax
        run: node --check scripts/sonar_q105_weekday_conditioned_subset.js
      - name: Generate deterministic walk-forward outputs
        run: node scripts/sonar_q105_weekday_conditioned_subset.js --write
      - name: Persist outputs on research branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sequence_agent/q105_weekday_conditioned_subset_report_2026-11-10.json reports/sequence_agent/q105_weekday_conditioned_subset_validation_2026-11-10.json reports/sequence_agent/q105_weekday_conditioned_subset_target_ledger_2026-11-10.csv reports/sequence_agent/q105_weekday_conditioned_subset_checkpoint_2026-11-10.md reports/sequence_agent/q105_weekday_conditioned_subset_persistence_manifest_2026-11-10.json
          if ! git diff --cached --quiet; then
            git commit -m "Q105: persist weekday-conditioned walk-forward evidence"
            git push origin "HEAD:${REF_NAME}"
          fi
      - name: Recompute and byte-compare persisted outputs
        run: node scripts/sonar_q105_weekday_conditioned_subset.js --check
