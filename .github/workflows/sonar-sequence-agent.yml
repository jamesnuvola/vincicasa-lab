name: SONAR Sequence Discovery Agent

on:
  # Hourly autonomous research cycle. The evolutionary search expands the
  # candidate family and records reproducible diagnostics without auto-promotion.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/sonar_sequence_agent.py"
      - "scripts/sonar_research_queue.py"
      - "scripts/sonar_fast_improvements.py"
      - "scripts/sonar_evolutionary_lab.py"
      - "scripts/sonar_position_regime_residual_lab.py"
      - "scripts/sonar_structural_category_lab.py"
      - "reports/sequence_agent/research_backlog.json"
      - "data/storico_daily.csv"
      - "src/data.json"
      - ".github/workflows/sonar-sequence-agent.yml"

permissions:
  contents: write

concurrency:
  group: vincicasa-main-data-writers
  cancel-in-progress: false

jobs:
  sequence-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check agent syntax
        run: |
          python -m py_compile scripts/sonar_sequence_agent.py
          python -m py_compile scripts/sonar_fast_improvements.py
          python -m py_compile scripts/sonar_evolutionary_lab.py
          python -m py_compile scripts/sonar_position_regime_residual_lab.py
          python -m py_compile scripts/sonar_structural_category_lab.py
          python -m py_compile scripts/sonar_research_queue.py

      - name: Reconstruct fixed rules walk-forward and update shadow forecasts
        run: python scripts/sonar_sequence_agent.py

      - name: Run cascade-loss and fixed fusion diagnostics
        run: python scripts/sonar_fast_improvements.py

      - name: Run evolutionary pairwise strategy search
        run: python scripts/sonar_evolutionary_lab.py

      - name: Run positional, regime, residual and structural hazard lab
        run: python scripts/sonar_position_regime_residual_lab.py

      - name: Run structural age-versus-frequency OOS lab
        run: python scripts/sonar_structural_category_lab.py

      - name: Validate and sequence the registered research backlog
        run: python scripts/sonar_research_queue.py

      - name: Persist all research reports and frozen forecasts
        run: |
          git config user.name "sonar-sequence-agent"
          git config user.email "actions@users.noreply.github.com"
          git add reports/sequence_agent/
          pushed=false
          for attempt in 1 2 3; do
            if git diff --cached --quiet; then
              echo "No report or forecast changes; outputs already match this checkout."
              pushed=true
              break
            fi
            git commit -m "SONAR sequence agent: refresh research and strategy search"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Remote main advanced during analysis; reloading latest history and recomputing (attempt $((attempt + 1))/3)."
              git fetch origin main
              git reset --hard origin/main
              python -m py_compile scripts/sonar_sequence_agent.py scripts/sonar_fast_improvements.py scripts/sonar_evolutionary_lab.py scripts/sonar_position_regime_residual_lab.py scripts/sonar_structural_category_lab.py scripts/sonar_research_queue.py
              python scripts/sonar_sequence_agent.py
              python scripts/sonar_fast_improvements.py
              python scripts/sonar_evolutionary_lab.py
              python scripts/sonar_position_regime_residual_lab.py
              python scripts/sonar_structural_category_lab.py
              python scripts/sonar_research_queue.py
              git add reports/sequence_agent/
            fi
          done
          if [ "$pushed" != "true" ]; then
            echo "Persistence failed after three attempts; outputs were not reported as saved."
            exit 1
          fi
