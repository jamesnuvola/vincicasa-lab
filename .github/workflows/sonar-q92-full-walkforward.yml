      - name: Verify result branch Git-tree/blob byte readback
        env:
          RESULT_BRANCH: research/sonar-q92-results-20261108-${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$RESULT_BRANCH:refs/remotes/origin/$RESULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RESULT_BRANCH"
          python - <<'PY'
          import hashlib,json,subprocess,os
          from pathlib import Path
          branch="origin/research/sonar-q92-results-20261108"
          paths=["reports/sequence_agent/q92_20261108_report.json","reports/sequence_agent/q92_20261108_manifest.json",
            "reports/sequence_agent/q92_20261108_candidate_shortlist.csv","reports/sequence_agent/q92_20261108_candidate_selection.json",
            "reports/sequence_agent/q92_20261108_paired_blind_ledger.csv","reports/sequence_agent/q92_20261108_paired_inference.json",
            "reports/sequence_agent/q92_20261108_shard_artifact_manifest.json","reports/sequence_agent/q92_20261108_acceptance_summary.json"]
          def show(path):
              result=subprocess.run(["git","show",branch+":"+path],capture_output=True)
              if result.returncode:raise SystemExit("Q92_GIT_READBACK_BLOCKED: missing result-branch path "+path)
              return result.stdout
          def blob_sha(raw):
              return hashlib.sha1(b"blob "+str(len(raw)).encode("ascii")+bytes([0])+raw).hexdigest()
          def tree_sha(path):
              result=subprocess.run(["git","ls-tree",branch,path],capture_output=True,text=True)
              if result.returncode or not result.stdout.strip():raise SystemExit("Q92_GIT_READBACK_BLOCKED: missing Git tree entry "+path)
              return result.stdout.split()[2]
          for path in paths:
              raw=show(path)
              if raw!=Path(path).read_bytes():raise SystemExit("Q92_GIT_READBACK_BLOCKED: byte mismatch "+path)
              if tree_sha(path)!=blob_sha(raw):raise SystemExit("Q92_GIT_READBACK_BLOCKED: Git blob SHA mismatch "+path)
          receipt_path="reports/sequence_agent/q92_20261108_persistence_receipt.json"
          receipt_raw=show(receipt_path);receipt=json.loads(receipt_raw)
          summary=json.loads(Path("reports/sequence_agent/q92_20261108_acceptance_summary.json").read_text(encoding="utf-8"))
          if receipt.get("source_checkout_sha")!=os.environ["GITHUB_SHA"] or receipt.get("source_archive_sha256")!=summary["source_archive_sha256"] or receipt.get("output_sha256")!=summary["output_sha256"]:
              raise SystemExit("Q92_GIT_READBACK_BLOCKED: persisted receipt core mismatch")
          if receipt.get("artifact_bundle",{}).get("byte_readback_verified") is not True:
              raise SystemExit("Q92_GIT_READBACK_BLOCKED: receipt does not attest verified artifact byte readback")
          if tree_sha(receipt_path)!=blob_sha(receipt_raw):
              raise SystemExit("Q92_GIT_READBACK_BLOCKED: persistence receipt Git blob SHA mismatch")
          print("Q92_GIT_TREE_BLOB_READBACK_PASS: result branch "+branch+"; core files and receipt byte-identical; artifact digest readback recorded.")
          PY
