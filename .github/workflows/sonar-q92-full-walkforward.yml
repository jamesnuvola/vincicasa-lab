            "source_checkout_sha":os.environ["GITHUB_SHA"],"source_archive_sha256":summary["source_archive_sha256"],
            "report_sha256":sha(root/"q92_20261108_report.json"),"manifest_sha256":sha(root/"q92_20261108_manifest.json"),
            "summary_sha256":sha(root/"q92_20261108_acceptance_summary.json"),"output_sha256":summary["output_sha256"],
