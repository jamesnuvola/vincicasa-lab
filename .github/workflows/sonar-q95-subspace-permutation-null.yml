name: SONAR Q95 Constrained Spectral Permutation Null

on:
  push:
    branches:
      - research/q95-subspace-permutation-null-20261110
    paths:
      - "scripts/sonar_q95_subspace_permutation_null.py"
      - "scripts/validate_sonar_q95_subspace_permutation_null.py"
      - "tests/test_sonar_q95_subspace_permutation_null.py"
      - "reports/sequence_agent/q95_subspace_permutation_null_protocol_2026-11-10.json"
      - ".github/workflows/sonar-q95-subspace-permutation-null.yml"
  pull_request:
    branches:
      - research/q94-spectral-subspace-persistence-20261110
    paths:
      - "scripts/sonar_q95_subspace_permutation_null.py"
      - "scripts/validate_sonar_q95_subspace_permutation_null.py"
      - "tests/test_sonar_q95_subspace_permutation_null.py"
      - "reports/sequence_agent/q95_subspace_permutation_null_protocol_2026-11-10.json"
      - ".github/workflows/sonar-q95-subspace-permutation-null.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonar-q95-subspace-permutation-null
  cancel-in-progress: false

jobs:
  evaluate-accept-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out Q95 research branch
        uses: actions/checkout@v4
        with:
          ref: research/q95-subspace-permutation-null-20261110
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Compile Q95 engine and independent validator
        run: |
          python -m py_compile scripts/sonar_q95_subspace_permutation_null.py
          python -m py_compile scripts/validate_sonar_q95_subspace_permutation_null.py

      - name: Run accepted Q93/Q94 source regression tests
        run: |
          python tests/test_sonar_q93_spectral_coherence.py
          python tests/test_sonar_q94_spectral_subspace_persistence.py

      - name: Run Q95 regression tests
        run: python tests/test_sonar_q95_subspace_permutation_null.py

      - name: Detect pre-existing accepted Q95 outputs
        id: q95-state
        run: |
          if [ -f reports/sequence_agent/q95_subspace_permutation_null_validation.json ] && [ -f reports/sequence_agent/q95_subspace_permutation_null_manifest.json ]; then
            echo "preexisting=true" >> "$GITHUB_OUTPUT"
          else
            echo "preexisting=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute strict-prior Q95 walk-forward
        if: steps.q95-state.outputs.preexisting == 'false'
        run: python scripts/sonar_q95_subspace_permutation_null.py

      - name: Independently replay and accept Q95
        if: steps.q95-state.outputs.preexisting == 'false'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/validate_sonar_q95_subspace_permutation_null.py

      - name: Replay pre-existing Q95 outputs read-only
        if: steps.q95-state.outputs.preexisting == 'true'
        run: python scripts/validate_sonar_q95_subspace_permutation_null.py --read-only

      - name: Upload Q95 evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: q95-constrained-subspace-permutation-null
          path: |
            reports/sequence_agent/q95_subspace_permutation_null_catalog.jsonl
            reports/sequence_agent/q95_subspace_permutation_null_target_ledger.csv.gz
            reports/sequence_agent/q95_subspace_permutation_null_report.json
            reports/sequence_agent/q95_subspace_permutation_null_manifest.json
            reports/sequence_agent/q95_subspace_permutation_null_protocol_2026-11-10.json
            reports/sequence_agent/q95_subspace_permutation_null_checkpoint_2026-11-10.md
            reports/sequence_agent/q95_subspace_permutation_null_validation.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist accepted Q95 outputs append-only and replay exact persisted head
        if: steps.q95-state.outputs.preexisting == 'false'
        env:
          SONAR_BRANCH: research/q95-subspace-permutation-null-20261110
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$SONAR_BRANCH:refs/remotes/origin/$SONAR_BRANCH"
          for path in \
            reports/sequence_agent/q95_subspace_permutation_null_catalog.jsonl \
            reports/sequence_agent/q95_subspace_permutation_null_target_ledger.csv.gz \
            reports/sequence_agent/q95_subspace_permutation_null_report.json \
            reports/sequence_agent/q95_subspace_permutation_null_manifest.json \
            reports/sequence_agent/q95_subspace_permutation_null_checkpoint_2026-11-10.md \
            reports/sequence_agent/q95_subspace_permutation_null_validation.json; do
            if git cat-file -e "refs/remotes/origin/$SONAR_BRANCH:$path" 2>/dev/null; then
              echo "Append-only persistence blocked; path already exists: $path"
              exit 1
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/sequence_agent/q95_subspace_permutation_null_catalog.jsonl \
            reports/sequence_agent/q95_subspace_permutation_null_target_ledger.csv.gz \
            reports/sequence_agent/q95_subspace_permutation_null_report.json \
            reports/sequence_agent/q95_subspace_permutation_null_manifest.json \
            reports/sequence_agent/q95_subspace_permutation_null_checkpoint_2026-11-10.md \
            reports/sequence_agent/q95_subspace_permutation_null_validation.json
          git commit -m "Persist accepted Q95 constrained spectral permutation-null evidence"
          git push origin "HEAD:refs/heads/$SONAR_BRANCH"
          git fetch origin "refs/heads/$SONAR_BRANCH:refs/remotes/origin/$SONAR_BRANCH"
          git checkout --detach "refs/remotes/origin/$SONAR_BRANCH"
          python -m py_compile scripts/sonar_q95_subspace_permutation_null.py scripts/validate_sonar_q95_subspace_permutation_null.py
          python scripts/validate_sonar_q95_subspace_permutation_null.py --read-only
