name: SONAR Per-Number Condition Refresh

# Manual full refresh; ordinary branch pushes are handled by the single-writer CI pipeline.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sonar-per-number-condition-refresh
  cancel-in-progress: false

jobs:
  refresh-q80-q83:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/per-number-condition-grammar-20261026
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Verify syntax
        run: |
          python -m py_compile scripts/sonar_sequence_agent.py
          python -m py_compile scripts/sonar_per_number_condition_grammar.py
          python -m py_compile scripts/sonar_per_number_condition_4plus_grammar.py
          python -m py_compile scripts/sonar_per_number_condition_conditional_grammar.py
          python -m py_compile scripts/sonar_per_number_condition_5plus_grammar.py
          python -m py_compile scripts/sonar_research_queue.py
          python -m py_compile scripts/validate_formula_outputs.py
          python -m py_compile scripts/persist_q80_outputs.py

      - name: Refresh SONAR retrospective metrics and append-only shadow outcomes
        run: python scripts/sonar_sequence_agent.py

      - name: Recompute Q80 prior-only single/pair/triple grammar
        run: python scripts/sonar_per_number_condition_grammar.py

      - name: Recompute Q81 four-feature grammar
        run: python scripts/sonar_per_number_condition_4plus_grammar.py

      - name: Recompute Q82 conditional/nonlinear grammar
        run: python scripts/sonar_per_number_condition_conditional_grammar.py

      - name: Evaluate all 80,730 five-feature formulas in bounded batches
        run: python scripts/sonar_per_number_condition_5plus_grammar.py

      - name: Validate research queue
        run: python scripts/sonar_research_queue.py

      - name: Validate outputs and refresh the SONAR checkpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_UPDATE_CHECKPOINT: "1"
        run: python scripts/validate_formula_outputs.py

      - name: Persist and reread validated Q80-Q83 outputs
        id: persist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/persist_q80_outputs.py

      - name: Request CI on the persisted exact head
        if: steps.persist.outputs.commit_created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error -X POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"research/per-number-condition-grammar-20261026\"}"
