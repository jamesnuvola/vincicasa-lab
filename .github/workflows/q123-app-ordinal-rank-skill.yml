name: Q123 APP ordinal rank skill replay

on:
  push:
    branches: ["research/q123-app-ordinal-rank-skill-20261111"]
    paths:
      - "scripts/sonar_q123_app_ordinal_rank_skill.mjs"
      - "reports/sequence_agent/q123_app_ordinal_rank_skill_*"
      - ".github/workflows/q123-app-ordinal-rank-skill.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/sonar_q123_app_ordinal_rank_skill.mjs"
      - "reports/sequence_agent/q123_app_ordinal_rank_skill_*"
      - ".github/workflows/q123-app-ordinal-rank-skill.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Q123 runner syntax
        run: node --check scripts/sonar_q123_app_ordinal_rank_skill.mjs
      - name: Recompute and byte-compare Q123 artifacts
        run: node scripts/sonar_q123_app_ordinal_rank_skill.mjs --check
