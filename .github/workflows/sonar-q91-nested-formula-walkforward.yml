name: SONAR Q91 Nested Formula Walk-Forward
on:
  workflow_dispatch:
  pull_request:
    branches: ["research/per-number-condition-grammar-20261026"]
    paths:
      - "scripts/sonar_q91_nested_walkforward.py"
      - "scripts/validate_sonar_q91_nested_walkforward.py"
      - "scripts/persist_q91_outputs.py"
      - "tests/test_sonar_q91_nested_walkforward.py"
      - "scripts/sonar_research_queue.py"
      - "reports/sequence_agent/research_backlog.json"
      - "data/storico_daily.csv"
      - ".github/workflows/sonar-q91-nested-formula-walkforward.yml"
permissions:
  contents: write
  actions: write
concurrency:
  group: sonar-q91-nested-formula-walkforward
  cancel-in-progress: true
jobs:
  q91:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Detect already validated Q91 outputs on this PR merge ref
        id: preflight
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          report_path = Path("reports/sequence_agent/q91_nested_formula_walkforward.json")
          archive_blob_sha = subprocess.check_output(["git", "rev-parse", "HEAD:data/storico_daily.csv"], text=True).strip()
          q80_checkpoint_path = Path("reports/sequence_agent/per_number_condition_research_checkpoint.json")
          q80_archive_blob_sha = ""
          if q80_checkpoint_path.is_file():
              q80_checkpoint = json.loads(q80_checkpoint_path.read_text(encoding="utf-8"))
              q80_archive_blob_sha = q80_checkpoint.get("archive_snapshot", {}).get("source_blob_sha", "")
          archive_aligned = bool(q80_archive_blob_sha and q80_archive_blob_sha == archive_blob_sha)
          already = False
          if archive_aligned and report_path.is_file():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              acceptance = report.get("acceptance", {})
              checkpoint_rel = report.get("outputs", {}).get("checkpoint", "")
              checkpoint_path = Path(checkpoint_rel) if checkpoint_rel else None
              if checkpoint_path and checkpoint_path.is_file():
                  checkpoint = json.loads(checkpoint_path.read_text(encoding="utf-8"))
                  already = (
                      report.get("status") == "VALIDATED_PENDING_HUMAN_REVIEW"
                      and acceptance.get("validator") == "Q91_FORMULA_ACCEPTANCE_PASS"
                      and acceptance.get("human_review") == "PENDING_HUMAN_REVIEW_INTEGRATION"
                      and checkpoint.get("status") == "VALIDATED_PENDING_HUMAN_REVIEW_INTEGRATION"
                      and checkpoint.get("acceptance", {}).get("validator") == "Q91_FORMULA_ACCEPTANCE_PASS"
                      and checkpoint.get("acceptance", {}).get("human_review") == "PENDING_HUMAN_REVIEW_INTEGRATION"
                      and report.get("archive", {}).get("blob_sha") == archive_blob_sha
                      and checkpoint.get("archive_blob_sha") == archive_blob_sha
                      and checkpoint.get("report_sha256") == hashlib.sha256(report_path.read_bytes()).hexdigest()
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("archive_aligned=" + ("true" if archive_aligned else "false") + "\n")
              handle.write("already_validated=" + ("true" if already else "false") + "\n")
          if not archive_aligned:
              print("Q91_DEFERRED_Q80_ARCHIVE_MISMATCH current=" + archive_blob_sha + " q80_checkpoint=" + (q80_archive_blob_sha or "MISSING"))
          else:
              print("Q91_ALREADY_VALIDATED_SKIP_COMPUTE" if already else "Q91_FRESH_EVALUATION_REQUIRED")
          PY
      - name: Defer Q91 until Q80 archive checkpoint matches canonical archive
        if: steps.preflight.outputs.archive_aligned != 'true'
        run: echo "Q91_DEFERRED_Q80_ARCHIVE_MISMATCH; no nested scores are recomputed or accepted until Q80 is refreshed."
      - name: Compile Q91 engine, validator and persistence
        run: python -m py_compile scripts/sonar_q91_nested_walkforward.py scripts/validate_sonar_q91_nested_walkforward.py scripts/persist_q91_outputs.py scripts/sonar_research_queue.py tests/test_sonar_q91_nested_walkforward.py
      - name: Run Q91 regression tests
        run: python -m pytest -q tests/test_sonar_q91_nested_walkforward.py
      - name: Evaluate nested strict-prior formula anticipation
        if: steps.preflight.outputs.archive_aligned == 'true' && steps.preflight.outputs.already_validated != 'true'
        run: python scripts/sonar_q91_nested_walkforward.py
      - name: Fail-closed Q91 acceptance validator
        if: steps.preflight.outputs.archive_aligned == 'true'
        run: python scripts/validate_sonar_q91_nested_walkforward.py
      - name: Finalize Q91 acceptance checkpoint
        if: steps.preflight.outputs.archive_aligned == 'true' && steps.preflight.outputs.already_validated != 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path("reports/sequence_agent")
          report_path=p/"q91_nested_formula_walkforward.json"
          checkpoint_path=p/f"q91_checkpoint_{json.loads(report_path.read_text(encoding='utf-8'))['archive']['last_date']}.json"
          report=json.loads(report_path.read_text(encoding="utf-8"))
          checkpoint=json.loads(checkpoint_path.read_text(encoding="utf-8"))
          acceptance={
            "validator":"Q91_FORMULA_ACCEPTANCE_PASS",
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "source_merge_or_dispatch_sha":os.environ["GITHUB_SHA"],
            "exact_research_branch_head_sha":os.environ["GITHUB_HEAD_SHA"],
            "artifact_retention_days":90,
            "artifact_readback":"PENDING_EXTERNAL_READBACK",
            "current_head_ci":"PENDING",
            "human_review":"PENDING_HUMAN_REVIEW_INTEGRATION"
          }
          report["status"]="FORMULA_ACCEPTANCE_PASS_PENDING_ARTIFACT_READBACK_MAIN_CI_HUMAN_REVIEW"
          report["acceptance"]=acceptance
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          checkpoint["status"]=report["status"]
          checkpoint["acceptance"]=acceptance
          checkpoint["report_sha256"]=hashlib.sha256(report_path.read_bytes()).hexdigest()
          checkpoint_path.write_text(json.dumps(checkpoint,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Q91_ACCEPTANCE_CHECKPOINT_FINALIZED",checkpoint["report_sha256"])
          PY
      - name: Recheck finalized Q91 acceptance manifest
        if: steps.preflight.outputs.archive_aligned == 'true'
        run: python scripts/validate_sonar_q91_nested_walkforward.py
      - uses: actions/upload-artifact@v4
        if: steps.preflight.outputs.archive_aligned == 'true' && steps.preflight.outputs.already_validated != 'true'
        with:
          name: q91-nested-formula-walkforward-bundle
          path: |
            reports/sequence_agent/q91_formula_catalog.csv
            reports/sequence_agent/q91_policy_metrics.csv
            reports/sequence_agent/q91_target_ledger.csv
            reports/sequence_agent/q91_formula_selection_report.json
            reports/sequence_agent/q91_formula_target_scores_manifest.json
            reports/sequence_agent/q91_formula_target_scores_part_*.npz
            reports/sequence_agent/q91_nested_formula_walkforward.json
            reports/sequence_agent/q91_checkpoint_*.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist Q91 outputs with exact Git Data API readback
        id: persist
        if: steps.preflight.outputs.archive_aligned == 'true' && steps.preflight.outputs.already_validated != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_SOURCE_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/persist_q91_outputs.py
      # Persistence updates the PR head; generic CI then validates the refreshed PR merge ref.
