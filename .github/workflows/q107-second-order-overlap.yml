name: Q107 second-order overlap memory walk-forward

on:
  push:
    branches:
      - research/q107-second-order-overlap-20261111
    paths:
      - "data/storico_daily.csv"
      - "src/data.json"
      - "scripts/sonar_q107_second_order_overlap.js"
      - "reports/sequence_agent/q107_second_order_overlap_protocol_2026-11-11.json"
      - ".github/workflows/q107-second-order-overlap.yml"
  pull_request:
    branches:
      - main
    paths:
      - "data/storico_daily.csv"
      - "src/data.json"
      - "scripts/sonar_q107_second_order_overlap.js"
      - "reports/sequence_agent/q107_second_order_overlap_protocol_2026-11-11.json"
      - ".github/workflows/q107-second-order-overlap.yml"

permissions:
  contents: write

jobs:
  q107-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Q107 runner syntax
        run: node --check scripts/sonar_q107_second_order_overlap.js
      - name: Generate deterministic walk-forward artifacts
        if: github.event_name == 'push'
        run: node scripts/sonar_q107_second_order_overlap.js --write
      - name: Persist Q107 outputs on research branch
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sequence_agent/q107_second_order_overlap_report_2026-11-11.json reports/sequence_agent/q107_second_order_overlap_validation_2026-11-11.json reports/sequence_agent/q107_second_order_overlap_target_ledger_2026-11-11.csv reports/sequence_agent/q107_second_order_overlap_checkpoint_2026-11-11.md reports/sequence_agent/q107_second_order_overlap_persistence_manifest_2026-11-11.json
          if ! git diff --cached --quiet; then
            git commit -m "Q107: persist second-order overlap evidence"
            git push origin "HEAD:${REF_NAME}"
          fi
      - name: Recompute and byte-compare persisted artifacts
        if: github.event_name == 'push'
        run: node scripts/sonar_q107_second_order_overlap.js --check
