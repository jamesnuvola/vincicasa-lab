name: SONAR Q89 Neighbor-Identity Counterfactual

on:
  push:
    branches:
      - research/q89-neighbor-identity-counterfactual-20261110
    paths:
      - "scripts/sonar_q89_neighbor_identity_counterfactual.py"
      - "scripts/validate_sonar_q89_neighbor_identity_counterfactual.py"
      - "scripts/persist_sonar_q89_outputs.py"
      - "tests/test_sonar_q89_neighbor_identity_counterfactual.py"
      - "reports/sequence_agent/q89_neighbor_identity_counterfactual_protocol_2026-11-10.json"
      - ".github/workflows/sonar-q89-neighbor-identity-counterfactual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-q89-neighbor-identity-counterfactual
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ !contains(github.event.head_commit.message, '[q89-reuse-artifact]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/q89-neighbor-identity-counterfactual-20261110
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile Q89 runner and validator
        run: python -m py_compile scripts/sonar_q89_neighbor_identity_counterfactual.py scripts/validate_sonar_q89_neighbor_identity_counterfactual.py
      - name: Run Q89 regression tests
        run: python tests/test_sonar_q89_neighbor_identity_counterfactual.py -v
      - name: Execute strict-prior Q89 walk-forward
        run: python scripts/sonar_q89_neighbor_identity_counterfactual.py
      - name: Independently replay all Q89 outputs and statistical families
        run: python scripts/validate_sonar_q89_neighbor_identity_counterfactual.py
      - name: Upload validated Q89 bundle
        uses: actions/upload-artifact@v4
        with:
          name: q89-neighbor-identity-counterfactual-bundle
          path: |
            reports/sequence_agent/q89_neighbor_identity_counterfactual_catalog.jsonl
            reports/sequence_agent/q89_neighbor_identity_counterfactual_target_ledger.csv.gz
            reports/sequence_agent/q89_neighbor_identity_counterfactual_report.json
            reports/sequence_agent/q89_neighbor_identity_counterfactual_manifest.json
            reports/sequence_agent/q89_neighbor_identity_counterfactual_checkpoint_2026-11-10.json
            reports/sequence_agent/q89_neighbor_identity_counterfactual_validation.json
          if-no-files-found: error
          retention-days: 7

  persist:
    needs: evaluate
    if: ${{ always() && github.event_name == 'push' && (contains(github.event.head_commit.message, '[q89-reuse-artifact]') || needs.evaluate.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/q89-neighbor-identity-counterfactual-20261110
          fetch-depth: 0
          persist-credentials: false
      - name: Select validated artifact run
        id: artifact-run
        shell: bash
        run: |
          if git log -1 --format=%s | grep -Fq '[q89-reuse-artifact]'; then
            echo "run_id=42738954011" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: q89-neighbor-identity-counterfactual-bundle
          path: .q89-bundle
          run-id: ${{ steps.artifact-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Persist validated outputs via Git Data API and verify exact bytes
        id: persist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/persist_sonar_q89_outputs.py
      - name: Request general CI on persisted exact head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error -X POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"$GITHUB_REF_NAME\"}"

  verify-persisted:
    needs: persist
    if: ${{ needs.persist.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/q89-neighbor-identity-counterfactual-20261110
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile and rerun Q89 regression tests on persisted head
        run: |
          python -m py_compile scripts/sonar_q89_neighbor_identity_counterfactual.py scripts/validate_sonar_q89_neighbor_identity_counterfactual.py
          python tests/test_sonar_q89_neighbor_identity_counterfactual.py -v
      - name: Read-only replay exact persisted Q89 outputs
        run: python scripts/validate_sonar_q89_neighbor_identity_counterfactual.py --read-only
