name: SONAR Q88 Signed Node-Graph Transfer

on:
  pull_request:
    branches:
      - research/q87-node-graph-phase-lag-20261110
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sonar-q88-signed-node-graph-transfer
  cancel-in-progress: false

jobs:
  evaluate-validate-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Detect persisted Q88 outputs
        id: state
        run: |
          if git log --format=%s | grep -Fq '[q88-signed-transfer-persisted]' && test -s reports/sequence_agent/q88_signed_node_graph_transfer_validation.json; then
            echo "persisted=true" >> "$GITHUB_OUTPUT"
          else
            echo "persisted=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile Q88 model and validator
        run: python -m py_compile scripts/sonar_q88_signed_node_graph_transfer.py scripts/validate_sonar_q88_signed_node_graph_transfer.py
      - name: Run signed projection, prefix-only, smoothing and operator tests
        run: python tests/test_sonar_q88_signed_node_graph_transfer.py -v
      - name: Execute preregistered Q88 strict-prior walk-forward
        if: steps.state.outputs.persisted != 'true'
        env:
          SONAR_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/sonar_q88_signed_node_graph_transfer.py
      - name: Replay every target, transfer vector, rank and Holm family
        if: steps.state.outputs.persisted != 'true'
        run: python scripts/validate_sonar_q88_signed_node_graph_transfer.py
      - name: Persist append-only Q88 artifacts and verify exact Git readback
        if: steps.state.outputs.persisted != 'true'
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sequence_agent/q88_signed_node_graph_transfer_catalog.jsonl
          git add reports/sequence_agent/q88_signed_node_graph_transfer_target_ledger.csv.gz
          git add reports/sequence_agent/q88_signed_node_graph_transfer_report.json
          git add reports/sequence_agent/q88_signed_node_graph_transfer_manifest.json
          git add reports/sequence_agent/q88_signed_node_graph_transfer_checkpoint_2026-11-10.json
          git add reports/sequence_agent/q88_signed_node_graph_transfer_validation.json
          git commit -m "Persist Q88 signed node-graph transfer results [q88-signed-transfer-persisted]"
          git push origin "HEAD:$TARGET_BRANCH"
          for f in             reports/sequence_agent/q88_signed_node_graph_transfer_catalog.jsonl             reports/sequence_agent/q88_signed_node_graph_transfer_target_ledger.csv.gz             reports/sequence_agent/q88_signed_node_graph_transfer_report.json             reports/sequence_agent/q88_signed_node_graph_transfer_manifest.json             reports/sequence_agent/q88_signed_node_graph_transfer_checkpoint_2026-11-10.json             reports/sequence_agent/q88_signed_node_graph_transfer_validation.json; do
            git show "HEAD:$f" > /tmp/q88-readback
            cmp "$f" /tmp/q88-readback
          done
      - name: Request read-only replay and general CI on persisted exact head
        if: steps.state.outputs.persisted != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          curl --fail --silent --show-error -X POST             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/sonar-q88-signed-node-graph-transfer.yml/dispatches"             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             -d "{\"ref\":\"$TARGET_BRANCH\"}"
          curl --fail --silent --show-error -X POST             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches"             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             -d "{\"ref\":\"$TARGET_BRANCH\"}"
      - name: Replay persisted Q88 outputs read-only on exact head
        if: steps.state.outputs.persisted == 'true'
        run: python scripts/validate_sonar_q88_signed_node_graph_transfer.py --read-only
