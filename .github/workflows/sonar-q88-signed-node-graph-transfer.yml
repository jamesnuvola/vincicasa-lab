name: SONAR Q88 Signed Node-Graph Transfer Read-Only Replay and Dispatch

on:
  pull_request:
    branches:
      - research/q88-execution-base-20261110
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  actions: write

concurrency:
  group: sonar-q88-readonly-dispatch-20261110
  cancel-in-progress: false

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Detect persisted Q88 result checkpoint
        id: state
        run: |
          if git log --format=%s | grep -Fq '[q88-signed-transfer-persisted]' && test -s reports/sequence_agent/q88_signed_node_graph_transfer_validation.json; then
            echo "persisted=true" >> "$GITHUB_OUTPUT"
          else
            echo "persisted=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile Q88 model and validator
        run: python -m py_compile scripts/sonar_q88_signed_node_graph_transfer.py scripts/validate_sonar_q88_signed_node_graph_transfer.py
      - name: Run signed projection, prefix-only, smoothing and operator tests
        run: python tests/test_sonar_q88_signed_node_graph_transfer.py -v
      - name: Replay persisted Q88 outputs read-only on exact head
        if: steps.state.outputs.persisted == 'true'
        run: python scripts/validate_sonar_q88_signed_node_graph_transfer.py --read-only
      - name: Dispatch trusted Q88 compute-persist CI on the research head
        if: steps.state.outputs.persisted != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          curl --fail --silent --show-error -X POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"$TARGET_BRANCH\"}"
