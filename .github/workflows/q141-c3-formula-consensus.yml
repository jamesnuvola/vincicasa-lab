name: Q141-C3 canonical formula rank consensus

on:
  push:
    branches:
      - research/q141-formula-universe-behaviour-mapping-20261112
    paths-ignore:
      - "reports/sequence_agent/q141_formula_rank_consensus_*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: q141-c3-formula-consensus
  cancel-in-progress: false

jobs:
  q141-c3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependency
        run: python -m pip install --upgrade pip numpy

      - name: Run Q141-C3 leakage and determinism tests
        run: python tests/test_sonar_q141_formula_consensus.py -v

      - name: Run Q141-C3 strict-prior consensus walk-forward
        run: python scripts/sonar_q141_formula_consensus.py

      - name: Upload Q141-C3 reproducibility bundle
        uses: actions/upload-artifact@v4
        with:
          name: q141-c3-formula-rank-consensus-${{ github.sha }}
          path: |
            reports/sequence_agent/q141_formula_rank_consensus_formula_catalog_2026-11-12.csv
            reports/sequence_agent/q141_formula_rank_consensus_target_ledger_2026-11-12.csv
            reports/sequence_agent/q141_formula_rank_consensus_report_2026-11-12.json
            reports/sequence_agent/q141_formula_rank_consensus_manifest_2026-11-12.json
            reports/sequence_agent/q141_formula_rank_consensus_checkpoint_2026-11-12.json
          retention-days: 90

      - name: Persist Q141-C3 outputs append-only
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git add reports/sequence_agent/q141_formula_rank_consensus_formula_catalog_2026-11-12.csv
          git add reports/sequence_agent/q141_formula_rank_consensus_target_ledger_2026-11-12.csv
          git add reports/sequence_agent/q141_formula_rank_consensus_report_2026-11-12.json
          git add reports/sequence_agent/q141_formula_rank_consensus_manifest_2026-11-12.json
          git add reports/sequence_agent/q141_formula_rank_consensus_checkpoint_2026-11-12.json
          if git diff --cached --quiet; then
            echo "Q141-C3 outputs already match this checkout."
          else
            git config user.name "sonar-q141-research"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Persist Q141-C3 canonical formula consensus walk-forward"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin "${BRANCH_NAME}"
              if git rebase "origin/${BRANCH_NAME}" && git push origin "HEAD:${BRANCH_NAME}"; then
                pushed=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                git rebase --abort || true
                echo "Remote branch advanced; retrying append-only persistence."
              fi
            done
            if [ "$pushed" != "true" ]; then
              echo "Q141-C3 persistence failed after three attempts."
              exit 1
            fi
          fi

      - name: Verify exact remote Git readback
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin "${BRANCH_NAME}"
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          manifest_path = "reports/sequence_agent/q141_formula_rank_consensus_manifest_2026-11-12.json"
          manifest = json.loads(subprocess.check_output(
              ["git", "show", f"origin/{__import__('os').environ['BRANCH_NAME']}:{manifest_path}"]
          ))
          for path, expected in manifest["files"].items():
              remote = subprocess.check_output(
                  ["git", "show", f"origin/{__import__('os').environ['BRANCH_NAME']}:{path}"]
              )
              actual = hashlib.sha256(remote).hexdigest()
              if actual != expected["sha256"]:
                  raise SystemExit(f"remote SHA-256 mismatch: {path}")
              if len(remote) != expected["bytes"]:
                  raise SystemExit(f"remote byte-length mismatch: {path}")
          print("Q141-C3 exact remote Git readback verified for every manifest file.")
          PY
