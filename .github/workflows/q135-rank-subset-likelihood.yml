name: Q135 rank subset likelihood replay

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/sonar_q135_rank_subset_likelihood.mjs"
      - "reports/sequence_agent/q135_*"
      - ".github/workflows/q135-rank-subset-likelihood.yml"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run strict-prior fixed-size subset likelihood replay
        run: node scripts/sonar_q135_rank_subset_likelihood.mjs
      - name: Check generated artifacts
        run: git diff --check
      - name: Persist deterministic report and validation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sequence_agent/q135_rank_subset_likelihood_report_2026-11-12.json
          git add reports/sequence_agent/q135_rank_subset_likelihood_target_ledger_2026-11-12.csv
          git add reports/sequence_agent/q135_rank_subset_likelihood_validation_2026-11-12.json
          git add reports/sequence_agent/q135_rank_subset_likelihood_checkpoint_2026-11-12.md
          git add reports/sequence_agent/q135_rank_subset_likelihood_persistence_manifest_2026-11-12.json
          if git diff --cached --quiet; then
            echo "Q135 artifacts already match the deterministic replay."
          else
            git commit -m "Persist Q135 rank subset likelihood replay"
            git push origin "HEAD:${HEAD_REF}"
          fi
