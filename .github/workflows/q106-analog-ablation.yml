name: Q106 analog-successor vote ablation walk-forward

on:
  push:
    branches:
      - research/q106-analog-ablation-20261111
    paths:
      - "data/storico_daily.csv"
      - "src/data.json"
      - "src/VinciCasaLab.jsx"
      - "scripts/sonar_q106_analog_ablation.js"
      - "reports/sequence_agent/q106_analog_ablation_protocol_2026-11-11.json"
      - ".github/workflows/q106-analog-ablation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "data/storico_daily.csv"
      - "src/data.json"
      - "src/VinciCasaLab.jsx"
      - "scripts/sonar_q106_analog_ablation.js"
      - "reports/sequence_agent/q106_analog_ablation_protocol_2026-11-11.json"
      - ".github/workflows/q106-analog-ablation.yml"

permissions:
  contents: write

jobs:
  q106-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Q106 runner syntax
        run: node --check scripts/sonar_q106_analog_ablation.js
      - name: Generate deterministic walk-forward artifacts
        if: github.event_name == 'push'
        run: node scripts/sonar_q106_analog_ablation.js --write
      - name: Persist Q106 outputs on research branch
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sequence_agent/q106_analog_ablation_report_2026-11-11.json reports/sequence_agent/q106_analog_ablation_validation_2026-11-11.json reports/sequence_agent/q106_analog_ablation_target_ledger_2026-11-11.csv reports/sequence_agent/q106_analog_ablation_checkpoint_2026-11-11.md reports/sequence_agent/q106_analog_ablation_persistence_manifest_2026-11-11.json
          if ! git diff --cached --quiet; then
            git commit -m "Q106: persist analog-vote ablation evidence"
            git push origin "HEAD:${REF_NAME}"
          fi
      - name: Recompute and byte-compare persisted artifacts
        if: github.event_name == 'push'
        run: node scripts/sonar_q106_analog_ablation.js --check
