name: Q129 family-wise maximum Top20 hit audit replay

on:
  push:
    branches: ["research/q129-familywise-max-hit-audit-20261111"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q129-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'research/q129-familywise-max-hit-audit-20261111' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recompute family-wise walk-forward and verify persisted artifacts
        run: node scripts/sonar_q129_familywise_max_hit_audit.mjs --check
