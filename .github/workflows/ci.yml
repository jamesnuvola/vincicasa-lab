name: Test VinciCasa Lab

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Cancel superseded research-branch runs so several expensive historical searches
# do not compete after each incremental commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install data-generation dependency
        run: pip install numpy
      - name: Audit canonical historical archive
        run: python scripts/audit_dataset.py
      - name: Rebuild generated app data
        run: python scripts/rigenera_dati.py
      - name: Audit generated app data
        run: python scripts/audit_dataset.py --check-json
      - name: Test SONAR prospective gate eligibility
        run: python tests/test_sonar_prospective_gate.py -v
      - name: Check exact-source active SONAR engine diagnostic syntax
        run: node --check scripts/sonar_active_engine_walkforward.mjs
      - name: Check SONAR analysis and queue scripts
        run: python -m py_compile scripts/sonar_fast_improvements.py scripts/sonar_research_queue.py scripts/verify_psr04_artifact_reproducibility.py
      - name: Test evolutionary lab syntax and run
        run: |
          python -m py_compile scripts/sonar_evolutionary_lab.py
          python scripts/sonar_evolutionary_lab.py
      - name: Test positional, regime, residual and hazard lab
        run: |
          python -m py_compile scripts/sonar_position_regime_residual_lab.py
          python scripts/sonar_position_regime_residual_lab.py
      - name: Run SONAR PSR-01 position-specific walk-forward
        run: node scripts/sonar_psr01_position_specific_range_walkforward.mjs data/storico_daily.csv reports/position_specific_range_residual
      - name: Upload PSR-01 experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-psr01-walkforward
          path: reports/position_specific_range_residual/psr01_walkforward_*
          if-no-files-found: warn
      - name: Run SONAR PSR-02 odd-count-conditioned position walk-forward
        run: node scripts/sonar_psr02_position_oddcount_residual_walkforward.mjs data/storico_daily.csv reports/position_specific_range_residual
      - name: Upload PSR-02 experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-psr02-walkforward
          path: reports/position_specific_range_residual/psr02_walkforward_*
          if-no-files-found: warn
      - name: Run SONAR PSR-03 position lag-1 transition walk-forward
        env:
          SONAR_PSR03_EXPECTED_ARCHIVE_BLOB_SHA: "5d2efd70684e918b27d8f06386d545647898336d"
        run: node scripts/sonar_psr03_position_lag1_transition_walkforward.mjs data/storico_daily.csv reports/position_specific_range_residual
      - name: Verify PSR-03 outputs reproduce committed report byte-for-byte
        run: git diff --exit-code -- reports/position_specific_range_residual/PSR03_results_20261108.json reports/position_specific_range_residual/PSR03_results_20261108.md reports/position_specific_range_residual/PSR03_target_ledger_20261108.csv
      - name: Upload PSR-03 experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-psr03-position-lag1
          path: reports/position_specific_range_residual/PSR03_*
          if-no-files-found: warn
      - name: Run P5 exact order-statistic prior audit
        run: node scripts/sonar_p5_orderstat_prior_audit.mjs data/storico_daily.csv reports/sequence_agent/p5_pooled_logistic_walkforward_2026-11-07.json reports/sequence_agent/p5_logistic_rolling_and_permutation_audit_2026-11-07.json reports/position_specific_range_residual
      - name: Upload P5 prior audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-p5-orderstat-prior-audit
          path: reports/position_specific_range_residual/p5_orderstat_prior_audit_20261108.*
          if-no-files-found: warn
      - name: Run SONAR PSR-04 continuous lag-1 kernel walk-forward
        env:
          SONAR_PSR04_EXPECTED_ARCHIVE_BLOB_SHA: "5d2efd70684e918b27d8f06386d545647898336d"
        run: node scripts/sonar_psr04_continuous_lag1_kernel_walkforward.mjs data/storico_daily.csv reports/position_specific_range_residual/psr04_ci_recheck
      - name: Verify PSR-04 output reproducibility with tolerance-aware ledger audit
        run: python scripts/verify_psr04_artifact_reproducibility.py reports/position_specific_range_residual reports/position_specific_range_residual/psr04_ci_recheck
      - name: Upload PSR-04 experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-psr04-continuous-kernel
          path: reports/position_specific_range_residual/psr04_ci_recheck/PSR04_*
          if-no-files-found: warn
      - name: Run SONAR PSR-05 signed same-position displacement walk-forward
        env:
          SONAR_PSR05_EXPECTED_ARCHIVE_BLOB_SHA: "5d2efd70684e918b27d8f06386d545647898336d"
        run: node scripts/sonar_psr05_signed_displacement_residual_walkforward.mjs data/storico_daily.csv reports/position_specific_range_residual
      - name: Verify PSR-05 committed outputs reproduce on subsequent CI runs
        if: success() && github.ref == 'refs/heads/research/sonar-psr05-signed-displacement-20261108'
        run: |
          if git ls-files --error-unmatch reports/position_specific_range_residual/PSR05_results_20261108.json >/dev/null 2>&1; then
            git diff --exit-code -- reports/position_specific_range_residual/PSR05_results_20261108.json reports/position_specific_range_residual/PSR05_results_20261108.md reports/position_specific_range_residual/PSR05_grid_ledger_20261108.csv reports/position_specific_range_residual/PSR05_target_ledger_20261108.csv
          else
            echo "First PSR-05 run: generated outputs will be persisted after the job succeeds."
          fi
      - name: Upload PSR-05 experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-psr05-signed-displacement
          path: reports/position_specific_range_residual/PSR05_*
          if-no-files-found: warn
      - name: Run SONAR PSR-06 previous-draw range-state position walk-forward
        env:
          SONAR_PSR06_EXPECTED_ARCHIVE_BLOB_SHA: "5d2efd70684e918b27d8f06386d545647898336d"
        run: node scripts/sonar_psr06_previous_draw_range_state_walkforward.mjs data/storico_daily.csv reports/position_specific_range_residual
      - name: Verify PSR-06 committed outputs reproduce on subsequent CI runs
        if: success() && github.ref == 'refs/heads/research/sonar-psr06-range-conditioned-geometry-20261108'
        run: |
          if git ls-files --error-unmatch reports/position_specific_range_residual/PSR06_results_20261108.json >/dev/null 2>&1; then
            git diff --exit-code -- reports/position_specific_range_residual/PSR06_results_20261108.json reports/position_specific_range_residual/PSR06_results_20261108.md reports/position_specific_range_residual/PSR06_target_ledger_20261108.csv reports/position_specific_range_residual/PSR06_validation_grid_20261108.csv
          else
            echo "First PSR-06 run: generated outputs will be persisted after the job succeeds."
          fi
      - name: Upload PSR-06 experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-psr06-range-state
          path: reports/position_specific_range_residual/PSR06_*
          if-no-files-found: warn
      - name: Build web application
        run: npm install && npm run build
      - name: Persist PSR-06 reports on isolated research branch
        if: success() && github.ref == 'refs/heads/research/sonar-psr06-range-conditioned-geometry-20261108'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/position_specific_range_residual/PSR06_results_20261108.json reports/position_specific_range_residual/PSR06_results_20261108.md reports/position_specific_range_residual/PSR06_target_ledger_20261108.csv reports/position_specific_range_residual/PSR06_validation_grid_20261108.csv
          if git diff --cached --quiet; then
            echo "PSR-06 outputs already match persisted reports."
          else
            git commit -m "Persist PSR-06 range-state walk-forward results"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Persist PSR-05 reports on isolated research branch
        if: success() && github.ref == 'refs/heads/research/sonar-psr05-signed-displacement-20261108'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/position_specific_range_residual/PSR05_results_20261108.json reports/position_specific_range_residual/PSR05_results_20261108.md reports/position_specific_range_residual/PSR05_grid_ledger_20261108.csv reports/position_specific_range_residual/PSR05_target_ledger_20261108.csv
          if git diff --cached --quiet; then
            echo "PSR-05 outputs already match persisted reports."
          else
            git commit -m "Persist PSR-05 signed displacement walk-forward results"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
