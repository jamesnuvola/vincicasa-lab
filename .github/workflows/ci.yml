name: Test VinciCasa Lab

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Cancel superseded research-branch runs so several expensive historical searches
# do not compete after each incremental commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'research/per-number-condition-grammar-20261026' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[q80-persisted]')) }}

jobs:
  validate:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[q80-reuse-artifact]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install data-generation dependency
        run: pip install numpy
      - name: Audit canonical historical archive
        run: python scripts/audit_dataset.py
      - name: Rebuild generated app data
        run: python scripts/rigenera_dati.py
      - name: Audit generated app data
        run: python scripts/audit_dataset.py --check-json

      - name: Refresh SONAR retrospective metrics and append-only shadow outcomes
        if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[q80-validate-persisted]')) && github.head_ref != 'research/sonar-q92-ten-feature-implementation-20261109' && github.ref_name != 'research/sonar-q92-ten-feature-implementation-20261109'
        run: python scripts/sonar_sequence_agent.py
      - name: Test SONAR prospective gate eligibility
        run: python tests/test_sonar_prospective_gate.py -v
      - name: Verify persisted Q92 result branch (read-only)
        if: github.ref == 'refs/heads/research/sonar-q92-exact-null-calibration-20261109' || github.head_ref == 'research/sonar-q92-exact-null-calibration-20261109'
        env:
          RESULT_BRANCH: research/sonar-q92-results-20261108-64118b89a59cf689dea6c90a7736db6ef7aca0a3
          EXPECTED_SOURCE_CHECKOUT_SHA: 64118b89a59cf689dea6c90a7736db6ef7aca0a3
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$RESULT_BRANCH:refs/remotes/origin/$RESULT_BRANCH"
          python -m py_compile scripts/verify_sonar_q92_result_branch.py tests/test_sonar_q92_result_branch_readback.py
          python tests/test_sonar_q92_result_branch_readback.py -v
          python scripts/verify_sonar_q92_result_branch.py
      - name: Check exact-source active SONAR engine diagnostic syntax
        run: node --check scripts/sonar_active_engine_walkforward.mjs
      - name: Check SONAR analysis and queue scripts
        run: python -m py_compile scripts/sonar_fast_improvements.py scripts/sonar_research_queue.py
      - name: Run lightweight Q80-Q86 unit tests on stacked Q89 branch
        if: github.head_ref == 'research/sonar-q89-nine-feature-20261108' || github.ref_name == 'research/sonar-q89-nine-feature-20261108'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m py_compile scripts/sonar_sequence_agent.py scripts/sonar_per_number_condition_grammar.py scripts/sonar_per_number_condition_4plus_grammar.py scripts/sonar_per_number_condition_conditional_grammar.py scripts/sonar_per_number_condition_5plus_grammar.py scripts/sonar_per_number_condition_6plus_grammar.py scripts/chunk_q86_outputs.py scripts/persist_q86_outputs.py scripts/sonar_research_queue.py scripts/validate_formula_outputs.py
          python tests/test_sonar_per_number_condition_grammar.py -v
          python tests/test_sonar_per_number_condition_4plus_grammar.py -v
          python tests/test_sonar_per_number_condition_conditional_grammar.py -v
          python tests/test_sonar_per_number_condition_5plus_grammar.py -v
          python tests/test_sonar_per_number_condition_6plus_grammar.py -v
          python scripts/sonar_research_queue.py
      - name: Run lightweight Q80-Q86 and Q89 refresh delta tests on Q92 implementation branch
        if: github.head_ref == 'research/sonar-q92-ten-feature-implementation-20261109' || github.ref_name == 'research/sonar-q92-ten-feature-implementation-20261109'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m py_compile scripts/sonar_sequence_agent.py scripts/sonar_per_number_condition_grammar.py scripts/sonar_per_number_condition_4plus_grammar.py scripts/sonar_per_number_condition_conditional_grammar.py scripts/sonar_per_number_condition_5plus_grammar.py scripts/sonar_per_number_condition_6plus_grammar.py scripts/chunk_q86_outputs.py scripts/persist_q86_outputs.py scripts/sonar_research_queue.py scripts/validate_formula_outputs.py scripts/sonar_q89_common.py scripts/sonar_per_number_condition_9plus_shard.py scripts/aggregate_sonar_q89_shards.py scripts/sonar_q89_acceptance.py scripts/persist_q89_outputs.py scripts/sonar_q89_refresh_delta_shard.py scripts/aggregate_sonar_q89_refresh_delta.py scripts/validate_q89_refresh_delta.py scripts/persist_q89_refresh_delta.py tests/test_sonar_q89_refresh_delta.py tests/test_sonar_q89_refresh_aggregate.py
          python tests/test_sonar_per_number_condition_grammar.py -v
          python tests/test_sonar_per_number_condition_4plus_grammar.py -v
          python tests/test_sonar_per_number_condition_conditional_grammar.py -v
          python tests/test_sonar_per_number_condition_5plus_grammar.py -v
          python tests/test_sonar_per_number_condition_6plus_grammar.py -v
          python tests/test_sonar_q89_refresh_delta.py -v
          python tests/test_sonar_q89_refresh_aggregate.py -v
      - name: Test Q92 exact-head CI run selector
        if: github.head_ref == 'research/sonar-q92-exact-null-calibration-20261109' || github.ref_name == 'research/sonar-q92-exact-null-calibration-20261109'
        run: |
          python -m py_compile scripts/sonar_q92_ci_gate.py tests/test_sonar_q92_ci_gate.py
          python tests/test_sonar_q92_ci_gate.py -v
      - name: Test evolutionary lab syntax and run
        if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[q80-validate-persisted]')) && github.head_ref != 'research/sonar-q89-nine-feature-20261108' && github.ref_name != 'research/sonar-q89-nine-feature-20261108' && github.head_ref != 'research/sonar-q92-ten-feature-implementation-20261109' && github.ref_name != 'research/sonar-q92-ten-feature-implementation-20261109'
        run: |
          python -m py_compile scripts/sonar_evolutionary_lab.py
          python scripts/sonar_evolutionary_lab.py
      - name: Test positional, regime, residual and hazard lab
        if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[q80-validate-persisted]')) && github.head_ref != 'research/sonar-q89-nine-feature-20261108' && github.ref_name != 'research/sonar-q89-nine-feature-20261108' && github.head_ref != 'research/sonar-q92-ten-feature-implementation-20261109' && github.ref_name != 'research/sonar-q92-ten-feature-implementation-20261109'
        run: |
          python -m py_compile scripts/sonar_position_regime_residual_lab.py
          python scripts/sonar_position_regime_residual_lab.py
      - name: Test exhaustive per-number condition grammars (Q80/Q81/Q82/Q83/Q86)
        if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[q80-validate-persisted]')) && github.head_ref != 'research/sonar-q89-nine-feature-20261108' && github.ref_name != 'research/sonar-q89-nine-feature-20261108' && github.head_ref != 'research/sonar-q92-ten-feature-implementation-20261109' && github.ref_name != 'research/sonar-q92-ten-feature-implementation-20261109' && github.head_ref != 'research/sonar-q92-exact-null-calibration-20261109' && github.ref_name != 'research/sonar-q92-exact-null-calibration-20261109'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_RESEARCH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python -m py_compile scripts/sonar_sequence_agent.py scripts/sonar_per_number_condition_grammar.py scripts/sonar_per_number_condition_4plus_grammar.py scripts/sonar_per_number_condition_conditional_grammar.py scripts/sonar_per_number_condition_5plus_grammar.py scripts/sonar_per_number_condition_6plus_grammar.py scripts/chunk_q86_outputs.py scripts/persist_q86_outputs.py scripts/sonar_research_queue.py scripts/validate_formula_outputs.py
          python tests/test_sonar_per_number_condition_grammar.py -v
          python tests/test_sonar_per_number_condition_4plus_grammar.py -v
          python tests/test_sonar_per_number_condition_conditional_grammar.py -v
          python tests/test_sonar_per_number_condition_5plus_grammar.py -v
          python tests/test_sonar_per_number_condition_6plus_grammar.py -v
          python scripts/sonar_per_number_condition_grammar.py
          python scripts/sonar_per_number_condition_4plus_grammar.py
          python scripts/sonar_per_number_condition_conditional_grammar.py
          python scripts/sonar_per_number_condition_5plus_grammar.py
          python scripts/sonar_per_number_condition_6plus_grammar.py
          python scripts/chunk_q86_outputs.py
          python scripts/sonar_research_queue.py
          if [ "$SONAR_RESEARCH_BRANCH" = "research/sonar-q89-nine-feature-20261108" ]; then
            echo "SKIP_Q80_Q86_MAIN_ARCHIVE_GATE: Q89 is stacked on the Q88 branch archive through 2026-11-07; Q89-specific acceptance validates its own strict-prior outputs."
          else
            python scripts/validate_formula_outputs.py
          fi
          python scripts/sonar_research_queue.py
      - name: Validate persisted Q80/Q81/Q82/Q83/Q86 outputs on exact head
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[q80-validate-persisted]'))) && github.head_ref != 'research/sonar-q89-nine-feature-20261108' && github.ref_name != 'research/sonar-q89-nine-feature-20261108' && github.head_ref != 'research/sonar-q92-ten-feature-implementation-20261109' && github.ref_name != 'research/sonar-q92-ten-feature-implementation-20261109' && github.head_ref != 'research/sonar-q92-exact-null-calibration-20261109' && github.ref_name != 'research/sonar-q92-exact-null-calibration-20261109'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m py_compile scripts/sonar_sequence_agent.py scripts/sonar_per_number_condition_grammar.py scripts/sonar_per_number_condition_4plus_grammar.py scripts/sonar_per_number_condition_conditional_grammar.py scripts/sonar_per_number_condition_5plus_grammar.py scripts/sonar_per_number_condition_6plus_grammar.py scripts/chunk_q86_outputs.py scripts/persist_q86_outputs.py scripts/sonar_q89_common.py scripts/sonar_per_number_condition_9plus_shard.py scripts/aggregate_sonar_q89_shards.py scripts/sonar_q89_acceptance.py scripts/persist_q89_outputs.py scripts/sonar_research_queue.py scripts/validate_formula_outputs.py
          python tests/test_sonar_per_number_condition_grammar.py -v
          python tests/test_sonar_per_number_condition_4plus_grammar.py -v
          python tests/test_sonar_per_number_condition_conditional_grammar.py -v
          python tests/test_sonar_per_number_condition_5plus_grammar.py -v
          python tests/test_sonar_per_number_condition_6plus_grammar.py -v
          python tests/test_sonar_per_number_condition_9plus_grammar.py -v
          python scripts/sonar_research_queue.py
          python scripts/validate_formula_outputs.py
      - name: Dispatch preregistered Q88 refresh after exact-head CI
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[q88-persist-retry]')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error -X POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/sonar-q88-eight-feature.yml/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"research/per-number-condition-grammar-20261026\"}"

      - name: Build web application
        run: npm install && npm run build

      - name: Upload validated Q80-Q86 formula persistence bundle
        if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[q80-validate-persisted]')) && github.head_ref != 'research/sonar-q89-nine-feature-20261108' && github.ref_name != 'research/sonar-q89-nine-feature-20261108' && github.head_ref != 'research/sonar-q92-ten-feature-implementation-20261109' && github.ref_name != 'research/sonar-q92-ten-feature-implementation-20261109' && github.head_ref != 'research/sonar-q92-exact-null-calibration-20261109' && github.ref_name != 'research/sonar-q92-exact-null-calibration-20261109'
        uses: actions/upload-artifact@v4
        with:
          name: q80-q86-persistence-bundle
          path: |
            reports/sequence_agent/per_number_condition_grammar.json
            reports/sequence_agent/per_number_condition_formula_metrics.csv
            reports/sequence_agent/per_number_condition_target_ledger.csv
            reports/sequence_agent/per_number_condition_4plus_grammar.json
            reports/sequence_agent/per_number_condition_4plus_formula_metrics.csv
            reports/sequence_agent/per_number_condition_4plus_target_ledger.csv
            reports/sequence_agent/per_number_condition_conditional_grammar.json
            reports/sequence_agent/per_number_condition_conditional_metrics.csv
            reports/sequence_agent/per_number_condition_conditional_target_ledger.csv
            reports/sequence_agent/per_number_condition_5plus_grammar.json
            reports/sequence_agent/per_number_condition_5plus_formula_metrics.csv
            reports/sequence_agent/per_number_condition_5plus_target_ledger.csv
            reports/sequence_agent/per_number_condition_6plus_grammar.json
            reports/sequence_agent/per_number_condition_6plus_formula_metrics_manifest.json
            reports/sequence_agent/per_number_condition_6plus_formula_metrics_part_*.csv.gz
            reports/sequence_agent/per_number_condition_6plus_target_ledger.csv
            reports/sequence_agent/per_number_condition_research_checkpoint.json
            reports/sequence_agent/research_queue_status.json
            reports/sequence_agent/latest_metrics.json
            reports/sequence_agent/historical_rule_ledger.csv
            reports/sequence_agent/draw_signatures.csv
            reports/sequence_agent/wave_events.csv
            reports/sequence_agent/shadow_forecasts.csv
            reports/sequence_agent/archive_reconciliation_2026-10-28.json
          if-no-files-found: error
          retention-days: 1

  persist-q80:
    needs: validate
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/research/per-number-condition-grammar-20261026' && !contains(github.event.head_commit.message, '[q80-validate-persisted]') && (contains(github.event.head_commit.message, '[q80-reuse-artifact]') || needs.validate.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Download validated Q80-Q86 persistence bundle
        uses: actions/download-artifact@v4
        with:
          name: q80-q86-persistence-bundle
          path: .q80-persistence-bundle
          run-id: ${{ contains(github.event.head_commit.message, '[q80-reuse-artifact]') && '40913390261' || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore validated outputs for Git Data API persistence
        run: |
          mkdir -p reports/sequence_agent
          cp .q80-persistence-bundle/* reports/sequence_agent/
      - name: Persist validated Q80/Q81/Q82/Q83 outputs, archive sync and checkpoint with Git Data API
        id: persist-q80
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/persist_q80_outputs.py
      - name: Persist validated Q86 outputs via Git Data API and verify exact bytes
        id: persist-q86
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/persist_q86_outputs.py
      - name: Request CI on the persisted exact head
        if: steps.persist-q86.outputs.commit_created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error -X POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"$GITHUB_REF_NAME\"}"

# Q87/Q88 archive-aligned retry dispatch: Q80 persisted evidence is validated on this exact head.
# Refresh Q80-Q86 walk-forward evidence against canonical archive through 2026-11-05; preserve Q87/Q88 outputs and freezes.
