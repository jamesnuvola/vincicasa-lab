name: Test VinciCasa Lab

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Cancel superseded research-branch runs so several expensive historical searches
# do not compete after each incremental commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install data-generation dependency
        run: pip install numpy
      - name: Audit canonical historical archive
        run: python scripts/audit_dataset.py
      - name: Rebuild generated app data
        run: python scripts/rigenera_dati.py
      - name: Audit generated app data
        run: python scripts/audit_dataset.py --check-json
      - name: Test SONAR prospective gate eligibility
        run: python tests/test_sonar_prospective_gate.py -v
      - name: Check exact-source active SONAR engine diagnostic syntax
        run: node --check scripts/sonar_active_engine_walkforward.mjs
      - name: Check SONAR analysis and queue scripts
        run: python -m py_compile scripts/sonar_fast_improvements.py scripts/sonar_research_queue.py
      - name: Test evolutionary lab syntax and run
        run: |
          python -m py_compile scripts/sonar_evolutionary_lab.py
          python scripts/sonar_evolutionary_lab.py
      - name: Test positional, regime, residual and hazard lab
        run: |
          python -m py_compile scripts/sonar_position_regime_residual_lab.py
          python scripts/sonar_position_regime_residual_lab.py
      - name: Build web application
        run: npm install && npm run build

      - name: Detect Q88 persisted state on trusted branch push or dispatch
        id: q88-state
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'research/q88-signed-node-graph-transfer-20261110'
        run: |
          if git log --format=%s | grep -Fq '[q88-signed-transfer-persisted]' && test -s reports/sequence_agent/q88_signed_node_graph_transfer_validation.json; then
            echo "persisted=true" >> "$GITHUB_OUTPUT"
          else
            echo "persisted=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile and test Q88 signed transfer
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'research/q88-signed-node-graph-transfer-20261110'
        run: |
          python -m py_compile scripts/sonar_q88_signed_node_graph_transfer.py scripts/validate_sonar_q88_signed_node_graph_transfer.py
          python tests/test_sonar_q88_signed_node_graph_transfer.py -v
      - name: Execute Q88 strict-prior walk-forward
        if: steps.q88-state.outputs.persisted != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'research/q88-signed-node-graph-transfer-20261110'
        env:
          SONAR_SOURCE_SHA: ${{ github.sha }}
        run: python scripts/sonar_q88_signed_node_graph_transfer.py
      - name: Independently replay Q88 cutoffs, projections, ranks and Holm families
        if: steps.q88-state.outputs.persisted != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'research/q88-signed-node-graph-transfer-20261110'
        run: python scripts/validate_sonar_q88_signed_node_graph_transfer.py
      - name: Upload Q88 recovery bundle
        if: steps.q88-state.outputs.persisted != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'research/q88-signed-node-graph-transfer-20261110'
        uses: actions/upload-artifact@v4
        with:
          name: q88-signed-node-graph-transfer-persisted-bundle
          path: |
            reports/sequence_agent/q88_signed_node_graph_transfer_catalog.jsonl
            reports/sequence_agent/q88_signed_node_graph_transfer_target_ledger.csv.gz
            reports/sequence_agent/q88_signed_node_graph_transfer_report.json
            reports/sequence_agent/q88_signed_node_graph_transfer_manifest.json
            reports/sequence_agent/q88_signed_node_graph_transfer_checkpoint_2026-11-10.json
            reports/sequence_agent/q88_signed_node_graph_transfer_validation.json
          if-no-files-found: error
          retention-days: 7
      - name: Persist Q88 artifacts append-only and verify exact Git readback
        if: steps.q88-state.outputs.persisted != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'research/q88-signed-node-graph-transfer-20261110'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git"
          git add reports/sequence_agent/q88_signed_node_graph_transfer_catalog.jsonl
          git add reports/sequence_agent/q88_signed_node_graph_transfer_target_ledger.csv.gz
          git add reports/sequence_agent/q88_signed_node_graph_transfer_report.json
          git add reports/sequence_agent/q88_signed_node_graph_transfer_manifest.json
          git add reports/sequence_agent/q88_signed_node_graph_transfer_checkpoint_2026-11-10.json
          git add reports/sequence_agent/q88_signed_node_graph_transfer_validation.json
          git commit -m "Persist Q88 signed node-graph transfer results [q88-signed-transfer-persisted]"
          git push origin "HEAD:$TARGET_BRANCH"
          for f in \
            reports/sequence_agent/q88_signed_node_graph_transfer_catalog.jsonl \
            reports/sequence_agent/q88_signed_node_graph_transfer_target_ledger.csv.gz \
            reports/sequence_agent/q88_signed_node_graph_transfer_report.json \
            reports/sequence_agent/q88_signed_node_graph_transfer_manifest.json \
            reports/sequence_agent/q88_signed_node_graph_transfer_checkpoint_2026-11-10.json \
            reports/sequence_agent/q88_signed_node_graph_transfer_validation.json; do
            git show "HEAD:$f" > /tmp/q88-readback
            cmp "$f" /tmp/q88-readback
          done
          python scripts/validate_sonar_q88_signed_node_graph_transfer.py --read-only
      - name: Replay persisted Q88 outputs read-only on exact head
        if: steps.q88-state.outputs.persisted == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'research/q88-signed-node-graph-transfer-20261110'
        run: python scripts/validate_sonar_q88_signed_node_graph_transfer.py --read-only
      - name: Dispatch general CI on persisted Q88 exact head
        if: steps.q88-state.outputs.persisted != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'research/q88-signed-node-graph-transfer-20261110'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          curl --fail --silent --show-error -X POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"$TARGET_BRANCH\"}"
