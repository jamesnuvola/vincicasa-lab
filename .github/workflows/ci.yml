name: Test VinciCasa Lab

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded research-branch runs so several expensive historical searches
# do not compete after each incremental commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install data-generation dependency
        run: pip install numpy
      - name: Audit canonical historical archive
        run: python scripts/audit_dataset.py
      - name: Rebuild generated app data
        run: python scripts/rigenera_dati.py
      - name: Audit generated app data
        run: python scripts/audit_dataset.py --check-json
      - name: Test SONAR prospective gate eligibility
        run: python tests/test_sonar_prospective_gate.py -v
      - name: Check exact-source active SONAR engine diagnostic syntax
        run: node --check scripts/sonar_active_engine_walkforward.mjs
      - name: Check SONAR analysis and queue scripts
        run: python -m py_compile scripts/sonar_fast_improvements.py scripts/sonar_research_queue.py
      - name: Test evolutionary lab syntax and run
        run: |
          python -m py_compile scripts/sonar_evolutionary_lab.py
          python scripts/sonar_evolutionary_lab.py
      - name: Test positional, regime, residual and hazard lab
        run: |
          python -m py_compile scripts/sonar_position_regime_residual_lab.py
          python scripts/sonar_position_regime_residual_lab.py
      - name: Run Q93 spectral-coherence walk-forward and independent acceptance
        if: github.ref == 'refs/heads/research/q93-spectral-coherence-20261110' && github.event_name == 'push'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python -m py_compile scripts/sonar_q93_spectral_coherence.py
          python -m py_compile scripts/validate_sonar_q93_spectral_coherence.py
          python -m py_compile scripts/persist_sonar_q93_outputs.py
          python -m pytest -q tests/test_sonar_q93_spectral_coherence.py
          python scripts/sonar_q93_spectral_coherence.py
          python scripts/validate_sonar_q93_spectral_coherence.py
      - name: Upload Q93 accepted output bundle
        if: github.ref == 'refs/heads/research/q93-spectral-coherence-20261110' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: q93-spectral-coherence-bundle
          path: |
            reports/sequence_agent/q93_spectral_coherence_catalog.jsonl
            reports/sequence_agent/q93_spectral_coherence_target_ledger.csv.gz
            reports/sequence_agent/q93_spectral_coherence_report.json
            reports/sequence_agent/q93_spectral_coherence_manifest.json
            reports/sequence_agent/q93_spectral_coherence_protocol_2026-11-10.json
            reports/sequence_agent/q93_spectral_coherence_checkpoint_2026-11-10.md
            reports/sequence_agent/q93_spectral_coherence_validation.json
          if-no-files-found: error
          retention-days: 90
      - name: Build web application
        run: npm install && npm run build

  persist-q93:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/q93-spectral-coherence-20261110' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/q93-spectral-coherence-20261110
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Download Q93 accepted bundle
        uses: actions/download-artifact@v4
        with:
          name: q93-spectral-coherence-bundle
          path: .q93-bundle
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Persist Q93 outputs append-only and verify exact Git-object bytes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SONAR_BRANCH: research/q93-spectral-coherence-20261110
        run: python scripts/persist_sonar_q93_outputs.py
      - name: Check out persisted exact head
        run: |
          git fetch origin refs/heads/research/q93-spectral-coherence-20261110:refs/remotes/origin/research/q93-spectral-coherence-20261110
          git checkout --detach refs/remotes/origin/research/q93-spectral-coherence-20261110
      - name: Replay Q93 outputs read-only on persisted head
        run: |
          python -m py_compile scripts/sonar_q93_spectral_coherence.py scripts/validate_sonar_q93_spectral_coherence.py
          python scripts/validate_sonar_q93_spectral_coherence.py --read-only
