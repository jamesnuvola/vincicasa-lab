name: Test VinciCasa Lab

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded research-branch runs so several expensive historical searches
# do not compete after each incremental commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !(startsWith(github.head_ref, 'research/q141-') || startsWith(github.ref, 'refs/heads/research/q141-')) }}

jobs:
  validate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install data-generation dependency
        run: pip install numpy
      - name: Test Q141-B1 canonical formula registry and future-suffix invariance
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/q141-'))
        run: python tests/test_sonar_q141_formula_registry.py -v
      - name: Run Q141-B1 exact alias canonicalization walk-forward
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/q141-'))
        run: python scripts/sonar_q141_formula_registry.py
      - name: Upload Q141-B1 formula registry bundle
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/q141-'))
        uses: actions/upload-artifact@v4
        with:
          name: q141-b1-formula-registry-${{ github.sha }}
          path: |
            reports/sequence_agent/q141_formula_registry.json
            reports/sequence_agent/q141_formula_alias_walkforward_report_2026-11-12.json
            reports/sequence_agent/q141_formula_alias_walkforward_target_ledger_2026-11-12.csv
            reports/sequence_agent/q141_formula_registry_manifest_2026-11-12.json
            reports/sequence_agent/q141_formula_registry_checkpoint_2026-11-12.json
          retention-days: 90
      - name: Test Q141 formula-family leakage and determinism
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/q141-'))
        run: python tests/test_sonar_q141_formula_family_anticipation.py -v
      - name: Run Q141 strict-prior formula-family walk-forward
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/q141-'))
        run: python scripts/sonar_q141_formula_family_anticipation.py
      - name: Upload Q141 reproducibility bundle
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/q141-'))
        uses: actions/upload-artifact@v4
        with:
          name: q141-formula-family-behaviour-${{ github.sha }}
          path: |
            reports/sequence_agent/q141_formula_family_behaviour_report_2026-11-12.json
            reports/sequence_agent/q141_formula_family_behaviour_target_ledger_2026-11-12.csv
            reports/sequence_agent/q141_formula_family_behaviour_manifest_2026-11-12.json
          retention-days: 90
      - name: Test Q141-C1 size-adjusted pair-union e-process
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/q141-'))
        run: python tests/test_sonar_q141_formula_family_pair_union.py -v
      - name: Run Q141-C1 strict-prior pair-union walk-forward
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/q141-'))
        run: python scripts/sonar_q141_formula_family_pair_union.py
      - name: Upload Q141-C1 reproducibility bundle
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/q141-'))
        uses: actions/upload-artifact@v4
        with:
          name: q141-c1-pair-union-${{ github.sha }}
          path: |
            reports/sequence_agent/q141_formula_family_pair_union_report_2026-11-12.json
            reports/sequence_agent/q141_formula_family_pair_union_target_ledger_2026-11-12.csv
            reports/sequence_agent/q141_formula_family_pair_union_manifest_2026-11-12.json
          retention-days: 90
      - name: Test Q141-C2 current-state margin selector leakage and determinism
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/q141-'))
        run: python tests/test_sonar_q141_formula_family_margin_selector.py -v
      - name: Run Q141-C2 strict-prior current-state margin selector
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/q141-'))
        run: python scripts/sonar_q141_formula_family_margin_selector.py
      - name: Upload Q141-C2 reproducibility bundle
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/q141-'))
        uses: actions/upload-artifact@v4
        with:
          name: q141-c2-margin-selector-${{ github.sha }}
          path: |
            reports/sequence_agent/q141_formula_family_margin_selector_report_2026-11-12.json
            reports/sequence_agent/q141_formula_family_margin_selector_target_ledger_2026-11-12.csv
            reports/sequence_agent/q141_formula_family_margin_selector_manifest_2026-11-12.json
          retention-days: 90
      # PR runs validate and upload; only the push run persists to avoid concurrent add/add conflicts.
      - name: Persist Q141 outputs append-only to the research branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/q141-')
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git add reports/sequence_agent/q141_formula_family_behaviour_report_2026-11-12.json reports/sequence_agent/q141_formula_family_behaviour_target_ledger_2026-11-12.csv reports/sequence_agent/q141_formula_family_behaviour_manifest_2026-11-12.json
          git add reports/sequence_agent/q141_formula_family_pair_union_report_2026-11-12.json reports/sequence_agent/q141_formula_family_pair_union_target_ledger_2026-11-12.csv reports/sequence_agent/q141_formula_family_pair_union_manifest_2026-11-12.json
          git add reports/sequence_agent/q141_formula_family_margin_selector_report_2026-11-12.json reports/sequence_agent/q141_formula_family_margin_selector_target_ledger_2026-11-12.csv reports/sequence_agent/q141_formula_family_margin_selector_manifest_2026-11-12.json
          git add reports/sequence_agent/q141_formula_registry.json reports/sequence_agent/q141_formula_alias_walkforward_report_2026-11-12.json reports/sequence_agent/q141_formula_alias_walkforward_target_ledger_2026-11-12.csv reports/sequence_agent/q141_formula_registry_manifest_2026-11-12.json reports/sequence_agent/q141_formula_registry_checkpoint_2026-11-12.json
          if git diff --cached --quiet; then
            echo "Q141 outputs already match this exact checkout; no branch update needed."
          else
            git config user.name "sonar-q141-research"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Persist Q141 formula-family behaviour walk-forward"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${BRANCH_NAME}"; then
                pushed=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Research branch advanced during computation; rebasing the output commit onto its latest head."
                git fetch origin "$BRANCH_NAME"
                if ! git rebase FETCH_HEAD; then
                  conflicts="$(git diff --name-only --diff-filter=U)"
                  if [ -z "$conflicts" ]; then
                    echo "Q141 rebase failed without a resolvable conflict list."
                    exit 1
                  fi
        while IFS= read -r path; do
          case "$path" in
            reports/sequence_agent/q141_formula_family_behaviour_report_2026-11-12.json|reports/sequence_agent/q141_formula_family_behaviour_target_ledger_2026-11-12.csv|reports/sequence_agent/q141_formula_family_behaviour_manifest_2026-11-12.json|reports/sequence_agent/q141_formula_family_pair_union_report_2026-11-12.json|reports/sequence_agent/q141_formula_family_pair_union_target_ledger_2026-11-12.csv|reports/sequence_agent/q141_formula_family_pair_union_manifest_2026-11-12.json|reports/sequence_agent/q141_formula_family_margin_selector_report_2026-11-12.json|reports/sequence_agent/q141_formula_family_margin_selector_target_ledger_2026-11-12.csv|reports/sequence_agent/q141_formula_family_margin_selector_manifest_2026-11-12.json|reports/sequence_agent/q141_formula_registry.json|reports/sequence_agent/q141_formula_alias_walkforward_report_2026-11-12.json|reports/sequence_agent/q141_formula_alias_walkforward_target_ledger_2026-11-12.csv|reports/sequence_agent/q141_formula_registry_manifest_2026-11-12.json|reports/sequence_agent/q141_formula_registry_checkpoint_2026-11-12.json)
              echo "Resolving concurrent Q141 generated-output conflict in favor of this run: $path"
              git checkout --theirs -- "$path"
              git add "$path"
              ;;
            *)
              echo "Unexpected Q141 persistence conflict; refusing automatic resolution: $path"
              exit 1
              ;;
          esac
        done <<< "$conflicts"
        GIT_EDITOR=true git rebase --continue
      fi
              fi
            done
            if [ "$pushed" != "true" ]; then
              echo "Q141 append-only persistence failed after three attempts."
              exit 1
            fi
          fi
      - name: Audit canonical historical archive
        run: python scripts/audit_dataset.py
      - name: Rebuild generated app data
        run: python scripts/rigenera_dati.py
      - name: Audit generated app data
        run: python scripts/audit_dataset.py --check-json
      - name: Test SONAR prospective gate eligibility
        run: python tests/test_sonar_prospective_gate.py -v
      - name: Check exact-source active SONAR engine diagnostic syntax
        run: node --check scripts/sonar_active_engine_walkforward.mjs
      - name: Check SONAR analysis and queue scripts
        run: python -m py_compile scripts/sonar_fast_improvements.py scripts/sonar_research_queue.py
      - name: Test evolutionary lab syntax and run
        run: |
          python -m py_compile scripts/sonar_evolutionary_lab.py
          python scripts/sonar_evolutionary_lab.py
      - name: Test positional, regime, residual and hazard lab
        run: |
          python -m py_compile scripts/sonar_position_regime_residual_lab.py
          python scripts/sonar_position_regime_residual_lab.py
      - name: Build web application
        run: npm install && npm run build
