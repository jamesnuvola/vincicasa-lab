name: SONAR Q88 Signed Transfer Compute and Persist

on:
  push:
    branches:
      - research/q88-signed-node-graph-transfer-20261110
    paths:
      - "reports/sequence_agent/q88_execution_trigger_checkpoint_2026-11-10.md"

permissions:
  contents: write

concurrency:
  group: sonar-q88-signed-transfer-persist-20261110
  cancel-in-progress: false

jobs:
  compute-validate-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Detect persisted Q88 result checkpoint
        id: state
        run: |
          if git log --format=%s | grep -Fq '[q88-signed-transfer-persisted]' && test -s reports/sequence_agent/q88_signed_node_graph_transfer_validation.json; then
            echo "persisted=true" >> "$GITHUB_OUTPUT"
          else
            echo "persisted=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile Q88 model and validator
        run: python -m py_compile scripts/sonar_q88_signed_node_graph_transfer.py scripts/validate_sonar_q88_signed_node_graph_transfer.py
      - name: Run signed projection, prefix-only, smoothing and operator tests
        run: python tests/test_sonar_q88_signed_node_graph_transfer.py -v
      - name: Execute preregistered Q88 strict-prior walk-forward
        if: steps.state.outputs.persisted != 'true'
        env:
          SONAR_SOURCE_SHA: ${{ github.sha }}
        run: python scripts/sonar_q88_signed_node_graph_transfer.py
      - name: Independently replay every target, transfer vector, rank and Holm family
        if: steps.state.outputs.persisted != 'true'
        run: python scripts/validate_sonar_q88_signed_node_graph_transfer.py
      - name: Upload Q88 persistence bundle as recovery evidence
        if: steps.state.outputs.persisted != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q88-signed-node-graph-transfer-persisted-bundle
          path: |
            reports/sequence_agent/q88_signed_node_graph_transfer_catalog.jsonl
            reports/sequence_agent/q88_signed_node_graph_transfer_target_ledger.csv.gz
            reports/sequence_agent/q88_signed_node_graph_transfer_report.json
            reports/sequence_agent/q88_signed_node_graph_transfer_manifest.json
            reports/sequence_agent/q88_signed_node_graph_transfer_checkpoint_2026-11-10.json
            reports/sequence_agent/q88_signed_node_graph_transfer_validation.json
          if-no-files-found: error
          retention-days: 7
      - name: Persist append-only Q88 artifacts and verify exact Git readback
        if: steps.state.outputs.persisted != 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sequence_agent/q88_signed_node_graph_transfer_catalog.jsonl
          git add reports/sequence_agent/q88_signed_node_graph_transfer_target_ledger.csv.gz
          git add reports/sequence_agent/q88_signed_node_graph_transfer_report.json
          git add reports/sequence_agent/q88_signed_node_graph_transfer_manifest.json
          git add reports/sequence_agent/q88_signed_node_graph_transfer_checkpoint_2026-11-10.json
          git add reports/sequence_agent/q88_signed_node_graph_transfer_validation.json
          git commit -m "Persist Q88 signed node-graph transfer results [q88-signed-transfer-persisted]"
          git push origin "HEAD:$TARGET_BRANCH"
          for f in \
            reports/sequence_agent/q88_signed_node_graph_transfer_catalog.jsonl \
            reports/sequence_agent/q88_signed_node_graph_transfer_target_ledger.csv.gz \
            reports/sequence_agent/q88_signed_node_graph_transfer_report.json \
            reports/sequence_agent/q88_signed_node_graph_transfer_manifest.json \
            reports/sequence_agent/q88_signed_node_graph_transfer_checkpoint_2026-11-10.json \
            reports/sequence_agent/q88_signed_node_graph_transfer_validation.json; do
            git show "HEAD:$f" > /tmp/q88-readback
            cmp "$f" /tmp/q88-readback
          done
          python scripts/validate_sonar_q88_signed_node_graph_transfer.py --read-only
      - name: Replay already persisted Q88 outputs read-only
        if: steps.state.outputs.persisted == 'true'
        run: python scripts/validate_sonar_q88_signed_node_graph_transfer.py --read-only
